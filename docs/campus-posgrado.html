  var TYPE_ORDER = ["curso", "video", "libro", "lectura", "docs", "norma", "dataset", "tool", "cert"];
  var LS = "campus-posgrado-v1";

  var state = {
    courses: [],
    activeId: null,
    tab: "plan",
    progress: {},
    open: {},
    openDv: {},
    subs: {},
    grades: {},
    filter: "all",
    query: "",
    view: "course",
    aulaResId: null,
    lessonId: null,
    openUnit: {},
    quizzes: {},
    exams: {},
    examDraft: {}
  };
  var db = null;
  var sampler = null;
  var MAX_TEXT = 60000;

  function uid(p) { return (p || "x") + "-" + Math.random().toString(36).slice(2, 9); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove("on"); }, 2200);
  }

  /* ---- normalización ---- */
  function normalize(c) {
    var course = {
      id: c.id || uid("c"),
      code: c.code || "PRG",
      title: c.title || "Programa sin título",
      subtitle: c.subtitle || "",
      area: c.area || "",
      level: c.level || "Posgrado",
      hoursWeek: Number(c.hoursWeek) || 10,
      weeks: Number(c.weeks) || 0,
      createdAt: c.createdAt || new Date().toISOString(),
      modules: []
    };
    (c.modules || []).forEach(function (m, i) {
      var mod = {
        id: m.id || (course.id + "-m" + i),
        numeral: m.numeral || String(i + 1),
        title: m.title || "Asignatura",
        weeks: m.weeks || "",
        hours: Number(m.hours) || 0,
        objective: m.objective || "",
        practice: m.practice || "",
        deliverable: m.deliverable || "",
        mastery: m.mastery || "",
        resources: []
      };
      (m.resources || []).forEach(function (r, j) {
        var res = {
          id: r.id || (mod.id + "-r" + j),
          t: TYPES[r.t] ? r.t : "lectura",
          n: r.n || "Recurso",
          s: r.s || "",
          u: r.u || "",
          m: r.m || "",
          r: r.r || "",
          es: r.es || "",
          esNota: r.esNota || "",
          libre: r.libre || "",
          ficha: r.ficha || null
        };
        var b = BOOKS[res.n];
        if (b) {
          if (!res.es) { res.es = b.es; res.esNota = b.esNota; }
          if (!res.libre) res.libre = b.libre;
          if (!res.ficha) res.ficha = { tesis: b.tesis, claves: b.claves, aplicar: b.aplicar, limites: b.limites, leer: b.leer };
        }

        var a = AULAS[res.n];
        if (a) {
          res.aula = {
            source: a.source, url: a.url, note: a.note,
            units: (a.units || []).map(function (u, k) {
              var uid2 = res.id + "-u" + k;
              var lessons = (u.lessons || []).map(function (L, q) {
                return {
                  id: uid2 + "-l" + q, title: L.title, mins: L.mins || 0,
                  body: L.body || null, example: L.example || null, keys: L.keys || null,
                  exercise: L.exercise || null, quiz: L.quiz || null,
                  ready: !!(L.body && L.body.length)
                };
              });
              return {
                id: uid2, n: u.n || ("Unidad " + (k + 1)), title: u.title || "", hours: u.hours || 0,
                lessons: lessons, exam: u.exam || null,
                ready: lessons.some(function (L) { return L.ready; })
              };
            })
          };
        }
        mod.resources.push(res);
      });
      course.modules.push(mod);
    });
    return course;
  }

  function totalHours(c) {
    return c.modules.reduce(function (a, m) { return a + (m.hours || 0); }, 0);
  }
  function allRes(c) {
    var out = [];
    c.modules.forEach(function (m) {
      m.resources.forEach(function (r) { out.push({ mod: m, res: r }); });
    });
    return out;
  }
  function isDone(r) { return !!state.progress[r.id]; }
  function courseProgress(c) {
    var all = allRes(c), d = 0;
    all.forEach(function (x) { if (isDone(x.res)) d++; });
    return { done: d, total: all.length, pct: all.length ? Math.round(d / all.length * 100) : 0 };
  }
  function modProgress(m) {
    var d = 0;
    m.resources.forEach(function (r) { if (isDone(r)) d++; });
    return { done: d, total: m.resources.length, pct: m.resources.length ? Math.round(d / m.resources.length * 100) : 0 };
  }
  function active() {
    for (var i = 0; i < state.courses.length; i++) if (state.courses[i].id === state.activeId) return state.courses[i];
    return null;
  }

  /* ---- persistencia local (respaldo) ---- */
  function saveLocal() {
    try {
      localStorage.setItem(LS, JSON.stringify({
        courses: state.courses, progress: state.progress,
        subs: state.subs, grades: state.grades,
        quizzes: state.quizzes, exams: state.exams
      }));
    } catch (e) { /* almacenamiento no disponible o cuota llena */ }
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  /* ---- persistencia remota ---- */
  function persistCourse(c) {
    saveLocal();
    if (!db) return;
    db.collection("courses").doc(c.id).set(JSON.parse(JSON.stringify(c)))["catch"](function (e) {
      toast("No se pudo guardar en el servidor: " + e.code);
    });
  }
  function persistProgress() {
    saveLocal();
    if (!db) return;
    db.doc("progress/main").set({ items: state.progress, at: new Date().toISOString() })["catch"](function () {});
  }
  function removeCourse(id) {
    state.courses = state.courses.filter(function (c) { return c.id !== id; });
    saveLocal();
    if (db) db.collection("courses").doc(id)["delete"]()["catch"](function () {});
  }

  /* ==========================================================
     3. RENDER
     ========================================================== */

  function ring(pct) {
    var C = 2 * Math.PI * 12;
    return '<svg class="ring" viewBox="0 0 30 30" aria-hidden="true">' +
      '<circle class="bg" cx="15" cy="15" r="12"></circle>' +
      '<circle class="fg" cx="15" cy="15" r="12" stroke-dasharray="' + (C * pct / 100).toFixed(1) + ' ' + C.toFixed(1) + '"></circle>' +
      '<text x="15" y="18.5">' + pct + '</text></svg>';
  }

  function renderNav() {
    var nav = document.getElementById("nav");
    var q = state.query.toLowerCase();
    var list = state.courses.filter(function (c) {
      return !q || (c.title + " " + c.code + " " + c.area).toLowerCase().indexOf(q) > -1;
    });
    document.getElementById("ccount").textContent = state.courses.length;
    if (!list.length) {
      nav.innerHTML = '<div class="side-note" style="padding:.6rem">' +
        (state.courses.length ? "Ningún programa coincide." : "Todavía no hay programas.") + "</div>";
      return;
    }
    nav.innerHTML = list.map(function (c) {
      var p = courseProgress(c);
      return '<button class="cnav' + (c.id === state.activeId ? " on" : "") + '" data-course="' + esc(c.id) + '">' +
        '<div class="cnav-code">' + esc(c.code) + '</div>' +
        '<div class="cnav-t">' + esc(c.title) + '</div>' +
        '<div class="cnav-bar"><i style="width:' + p.pct + '%"></i></div>' +
        '<div class="cnav-meta">' + p.done + "/" + p.total + " recursos · " + c.modules.length + " asignaturas</div>" +
        "</button>";
    }).join("");
  }

  function resourceRow(r, modLabel) {
    var done = isDone(r);
    var name = r.u
      ? '<a href="' + esc(r.u) + '" target="_blank" rel="noopener noreferrer">' + esc(r.n) + "</a>"
      : esc(r.n);
    var sub = [];
    if (r.s) sub.push("<em>" + esc(r.s) + "</em>");
    if (r.m) sub.push(esc(r.m));
    if (r.aula) {
      var ap = aulaProgress(r.aula);
      sub.push('<b class="r-aula">' + ap.done + "/" + ap.total + " lecciones en el campus</b>");
    }
    var badges = "";
    if (r.es === "si") badges += '<span class="lang ok" title="' + esc(r.esNota) + '">ES</span>';
    else if (r.es === "no") badges += '<span class="lang no" title="' + esc(r.esNota) + '">EN</span>';
    else if (r.es === "?") badges += '<span class="lang qq" title="' + esc(r.esNota) + '">ES?</span>';
    if (r.libre) badges += '<a class="lang free" href="' + esc(r.libre) + '" target="_blank" rel="noopener noreferrer" title="Copia legalmente gratuita publicada por el autor o editor">Libre</a>';

    var hasFicha = !!(r.ficha && r.ficha.tesis) || !!r.r;
    var ficha = "";
    if (r.ficha && r.ficha.tesis) {
      ficha = '<div class="sum"><b>Ficha de lectura · notas de estudio en español</b>' +
        (r.esNota ? '<p class="fk-lang">' + esc(r.esNota) + "</p>" : "") +
        '<p class="fk-k">Tesis</p><p>' + esc(r.ficha.tesis) + "</p>" +
        '<p class="fk-k">Ideas clave</p><ul>' + (r.ficha.claves || []).map(function (k) { return "<li>" + esc(k) + "</li>"; }).join("") + "</ul>" +
        '<p class="fk-k">Qué aplicar</p><p>' + esc(r.ficha.aplicar) + "</p>" +
        '<p class="fk-k">Límites</p><p>' + esc(r.ficha.limites) + "</p>" +
        '<p class="fk-k">Cómo leerlo</p><p>' + esc(r.ficha.leer) + "</p>" +
        (r.libre ? '<p class="fk-free">Copia legalmente gratuita: <a href="' + esc(r.libre) + '" target="_blank" rel="noopener noreferrer">' + esc(r.libre) + "</a></p>" : "") +
        "</div>";
    } else if (r.r) {
      ficha = '<div class="sum"><b>Resumen</b>' + esc(r.r) + "</div>";
    }

    return '<div class="r' + (done ? " done" : "") + '" data-rid="' + esc(r.id) + '">' +
      '<input type="checkbox" data-check="' + esc(r.id) + '"' + (done ? " checked" : "") + ' aria-label="Marcar como completado">' +
      '<span class="ty ty-' + r.t + '">' + TYPES[r.t] + "</span>" +
      '<div><div class="r-n">' + name + badges + "</div>" +
      (sub.length ? '<div class="r-s">' + sub.join(" · ") + "</div>" : "") + "</div>" +
      (modLabel ? '<div class="r-mod">' + esc(modLabel) + "</div>" : "") +
      '<div class="r-x">' +
        (r.aula ? '<button class="btn btn-s btn-aula" data-aula="' + esc(r.id) + '">Abrir aula</button>' : "") +
        (hasFicha ? '<button class="btn btn-s" data-sum="' + esc(r.id) + '">' + (r.ficha && r.ficha.tesis ? "Ficha" : "Resumen") + "</button>" : "") +
        '<button class="btn btn-s" data-edit-res="' + esc(r.id) + '" title="Editar recurso">Editar</button>' +
      "</div>" + ficha +
      "</div>";
  }

  function renderPlan(c) {
    return c.modules.map(function (m) {
      var p = modProgress(m);
      var groups = TYPE_ORDER.filter(function (t) {
        return m.resources.some(function (r) { return r.t === t; });
      });
      var res = m.resources.length
        ? '<div class="res">' + groups.map(function (t) {
            return m.resources.filter(function (r) { return r.t === t; }).map(function (r) { return resourceRow(r, ""); }).join("");
          }).join("") + "</div>"
        : '<div class="box">Sin recursos todavía.</div>';
      return '<article class="mod' + (state.open[m.id] ? " open" : "") + '" data-mod="' + esc(m.id) + '">' +
        '<button class="mod-h" data-toggle="' + esc(m.id) + '" aria-expanded="' + (state.open[m.id] ? "true" : "false") + '">' +
          '<div class="mod-n">' + esc(m.numeral) + "</div>" +
          '<div><div class="mod-t">' + esc(m.title) + "</div>" +
          '<div class="mod-m">' + esc(m.weeks) + (m.hours ? " · " + m.hours + " h" : "") + " · " + m.resources.length + " recursos</div></div>" +
          '<div class="mod-r">' + ring(p.pct) + '<span class="caret">▶</span></div>' +
        "</button>" +
        '<div class="mod-b">' +
          (m.objective ? '<p class="obj">' + esc(m.objective) + "</p>" : "") +
          '<div class="lbl">Recursos de estudio</div>' + res +
          '<div class="actions"><button class="btn btn-s" data-add-res="' + esc(m.id) + '">+ Añadir recurso</button>' +
          '<button class="btn btn-s" data-edit-mod="' + esc(m.id) + '">Editar asignatura</button>' +
          '<button class="btn btn-s btn-d" data-del-mod="' + esc(m.id) + '">Eliminar</button></div>' +
          (m.practice || m.deliverable || m.mastery ? '<div class="lbl">Evaluación</div>' : "") +
          (m.practice ? '<div class="box prac"><span class="k">Práctica</span>' + esc(m.practice) + "</div>" : "") +
          (m.deliverable ? '<div class="box deliv"><span class="k">Entregable</span>' + esc(m.deliverable) + "</div>" : "") +
          (m.mastery ? '<div class="box mast"><span class="k">Criterio de dominio</span>' + esc(m.mastery) + "</div>" : "") +
        "</div></article>";
    }).join("") +
    '<div class="actions"><button class="btn btn-p" data-add-mod="1">+ Añadir asignatura</button></div>';
  }

  function renderLib(c) {
    var items = allRes(c);
    var counts = { all: items.length };
    TYPE_ORDER.forEach(function (t) {
      counts[t] = items.filter(function (x) { return x.res.t === t; }).length;
    });
    var chips = ['<button class="fbtn' + (state.filter === "all" ? " on" : "") + '" data-f="all">Todos ' + counts.all + "</button>"]
      .concat(TYPE_ORDER.filter(function (t) { return counts[t]; }).map(function (t) {
        return '<button class="fbtn' + (state.filter === t ? " on" : "") + '" data-f="' + t + '">' + TYPES[t] + " " + counts[t] + "</button>";
      })).join("");
    var rows = items.filter(function (x) { return state.filter === "all" || x.res.t === state.filter; });
    return '<div class="filters">' + chips + "</div>" +
      '<div class="lib">' + (rows.length
        ? rows.map(function (x) { return resourceRow(x.res, x.mod.numeral); }).join("")
        : '<div class="box" style="border:none">Sin recursos de este tipo.</div>') + "</div>" +
      '<p class="side-note" style="margin-top:.9rem">Los enlaces se verificaron al construir el programa. Si alguno cae, edita el recurso y actualiza la URL.</p>';
  }

  function gradeClass(n) { return n >= 4.5 ? "g-hi" : n >= 3.0 ? "g-ok" : "g-lo"; }

  function gradeCard(g) {
    var crit = (g.criterios || []).map(function (x) {
      var p = Math.max(0, Math.min(100, Number(x.puntaje) || 0));
      return '<div class="cri"><div class="cri-h"><span>' + esc(x.nombre || x.clave) + '</span><span class="cri-p">' + p + " / 100 · " + (x.peso || 0) + " %</span></div>" +
        '<div class="cri-bar"><i style="width:' + p + '%"></i></div>' +
        (x.comentario ? '<div class="cri-c">' + esc(x.comentario) + "</div>" : "") + "</div>";
    }).join("");
    function list(title, arr, cls) {
      if (!arr || !arr.length) return "";
      return '<div class="fb ' + cls + '"><span class="k">' + title + "</span><ul>" +
        arr.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul></div>";
    }
    var n = Number(g.nota) || 0;
    return '<div class="grade">' +
      '<div class="grade-h"><div class="grade-n ' + gradeClass(n) + '">' + n.toFixed(1) + '<small>/ 5.0</small></div>' +
      '<div class="grade-meta"><div class="grade-v ' + gradeClass(n) + '">' + esc(g.veredicto || "") + "</div>" +
      '<div class="grade-s">' + (g.porcentaje != null ? g.porcentaje + " / 100 · " : "") +
      "Calificado el " + esc(new Date(g.at || Date.now()).toLocaleString("es-CO")) + "</div>" +
      (g.fuente ? '<div class="grade-s">Fuente: ' + esc(g.fuente.nombre || "texto pegado") + " · " + (g.fuente.chars || 0).toLocaleString("es-CO") + " caracteres analizados</div>" : "") +
      "</div></div>" +
      (g.resumen ? '<p class="grade-r">' + esc(g.resumen) + "</p>" : "") +
      '<div class="cris">' + crit + "</div>" +
      list("Fortalezas", g.fortalezas, "fb-ok") +
      list("Debilidades", g.debilidades, "fb-no") +
      list("Para subir la nota", g.acciones, "fb-do") +
      "</div>";
  }

  function renderDeliv(c) {
    var mods = c.modules.filter(function (m) { return m.deliverable || m.mastery; });
    if (!mods.length) return '<div class="box">Este programa aún no define entregables.</div>';

    var head = '<div class="card"><h3>Entrega y calificación</h3>' +
      '<p class="hint">Sube el trabajo en PDF, TXT o Markdown —el archivo se lee en tu navegador y nunca se almacena—, o pega el texto. La calificación la produce Claude aplicando la rúbrica de abajo sobre el enunciado del entregable y el criterio de dominio de la asignatura.</p>' +
      '<div class="rub">' +
        rubRow("Cumplimiento del entregable", 25, "¿Entrega lo que se pidió, completo y en el formato indicado?") +
        rubRow("Rigor técnico", 25, "¿Los métodos son correctos y las conclusiones se sostienen sobre lo presentado?") +
        rubRow("Evidencia y evaluación", 20, "¿Hay datos, métricas y mediciones, en lugar de afirmaciones?") +
        rubRow("Aplicación profesional", 15, "¿Se aplica a un contexto real y concreto, no a un ejemplo genérico?") +
        rubRow("Claridad y citación", 15, "¿Estructura legible, fuentes citadas, figuras que aportan?") +
      "</div>" +
      '<p class="disc"><b>Calificación orientativa.</b> La produce un modelo de lenguaje a partir del texto que le entregas: sirve para detectar vacíos antes de presentar el trabajo, no sustituye la evaluación de un docente ni tiene validez académica. Aprobado a partir de 3.0.</p>' +
      (sampler ? "" : '<p class="disc warn">La calificación con IA no está disponible en esta vista. Puedes guardar la entrega igualmente.</p>') +
      "</div>";

    return head + mods.map(function (m) {
      var key = "dv::" + m.id;
      var sub = state.subs[m.id];
      var g = state.grades[m.id];
      var open = !!state.openDv[m.id];
      var chip = g ? '<span class="st ' + gradeClass(Number(g.nota) || 0) + '">' + (Number(g.nota) || 0).toFixed(1) + "</span>"
        : sub && sub.chars ? '<span class="st st-sub">Entregado</span>'
        : '<span class="st st-none">Sin entrega</span>';
      return '<div class="dv" data-dv="' + esc(m.id) + '"><div class="dv-n">' + esc(m.numeral) + "</div><div>" +
        '<h4>' + esc(m.title) + chip + "</h4>" +
        (m.deliverable ? '<div class="box deliv"><span class="k">Entregable</span>' + esc(m.deliverable) + "</div>" : "") +
        (m.mastery ? '<div class="box mast"><span class="k">Criterio de dominio</span>' + esc(m.mastery) + "</div>" : "") +
        '<div class="actions">' +
          '<button class="btn btn-s" data-dv-toggle="' + esc(m.id) + '">' + (open ? "Ocultar entrega" : (g ? "Ver calificación" : "Entregar trabajo")) + "</button>" +
          '<label style="display:flex;gap:.4rem;align-items:center;font-size:.85rem;cursor:pointer">' +
          '<input type="checkbox" data-check="' + esc(key) + '"' + (state.progress[key] ? " checked" : "") +
          ' style="width:15px;height:15px;accent-color:var(--accent)"> Marcado como completado</label></div>' +
        (open ? submitPanel(m, sub, g) : "") +
        "</div></div>";
    }).join("");
  }

  function rubRow(name, w, desc) {
    return '<div class="rub-r"><span class="rub-w">' + w + ' %</span><div><b>' + esc(name) + "</b><span>" + esc(desc) + "</span></div></div>";
  }

  function submitPanel(m, sub, g) {
    var chars = sub && sub.text ? sub.text.length : 0;
    return '<div class="sub-p">' +
      '<div class="lbl">Tu entrega</div>' +
      '<div class="sub-row">' +
        '<label class="file-btn">Elegir archivo (PDF, TXT, MD)' +
        '<input type="file" accept=".pdf,.txt,.md,.markdown,text/plain" data-file="' + esc(m.id) + '"></label>' +
        '<span class="sub-st" id="st-' + esc(m.id) + '">' +
          (sub && sub.name ? esc(sub.name) + " · " + chars.toLocaleString("es-CO") + " caracteres"
            : chars ? "Texto pegado · " + chars.toLocaleString("es-CO") + " caracteres" : "Ningún archivo cargado") +
        "</span>" +
      "</div>" +
      '<div class="fld" style="margin-top:.6rem"><label for="tx-' + esc(m.id) + '">O pega aquí el texto del trabajo</label>' +
      '<textarea id="tx-' + esc(m.id) + '" data-text="' + esc(m.id) + '" style="min-height:8rem" placeholder="Pega la memoria, el informe o el README del repositorio.">' + esc(sub && sub.text ? sub.text : "") + "</textarea></div>" +
      '<div class="fld" style="margin-top:.6rem"><label for="lk-' + esc(m.id) + '">Enlace al repositorio o documento (opcional)</label>' +
      '<input id="lk-' + esc(m.id) + '" type="url" placeholder="https://…" value="' + esc(sub && sub.link ? sub.link : "") + '"></div>' +
      '<div class="actions">' +
        '<button class="btn" data-save-sub="' + esc(m.id) + '">Guardar entrega</button>' +
        (sampler ? '<button class="btn btn-p" data-grade="' + esc(m.id) + '">' + (g ? "Volver a calificar" : "Calificar con IA") + "</button>" : "") +
        (g ? '<button class="btn btn-d" data-ungrade="' + esc(m.id) + '">Borrar calificación</button>' : "") +
      "</div>" +
      '<div id="gz-' + esc(m.id) + '">' + (g ? gradeCard(g) : "") + "</div>" +
      "</div>";
  }

  function renderSettings(c) {
    return '<div class="card"><h3>Datos del programa</h3>' +
      '<p class="hint">Se guardan en el almacén del artefacto y quedan disponibles la próxima vez que abras esta página.</p>' +
      '<div class="grid2">' +
        fld("s-code", "Código", c.code) +
        fld("s-area", "Área", c.area) +
        fld("s-level", "Nivel", c.level) +
        fld("s-hw", "Horas por semana", c.hoursWeek, "number") +
        fld("s-wk", "Semanas", c.weeks, "number") +
        '<div class="fld wide"><label for="s-title">Título</label><input id="s-title" value="' + esc(c.title) + '"></div>' +
        '<div class="fld wide"><label for="s-sub">Descripción</label><textarea id="s-sub">' + esc(c.subtitle) + "</textarea></div>" +
      "</div>" +
      '<div class="actions"><button class="btn btn-p" id="saveSettings">Guardar cambios</button>' +
      '<button class="btn btn-d" id="delCourse">Eliminar programa</button></div></div>' +
      '<div class="card"><h3>Progreso</h3><p class="hint">Reinicia todas las marcas de recursos y entregables de todos los programas.</p>' +
      '<button class="btn" id="resetProg">Reiniciar progreso</button></div>';
  }

  function fld(id, label, val, type) {
    return '<div class="fld"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type || "text") + '" value="' + esc(val) + '"></div>';
  }

  function render() {
    renderNav();
    var view = document.getElementById("view");
    var c = active();
    if (!c) {
      document.getElementById("crumb").innerHTML = "Campus";
      view.innerHTML = '<div class="empty"><h2>Ningún programa seleccionado</h2>' +
        "<p>Crea un programa nuevo desde la barra lateral o selecciona uno existente. Cada programa admite asignaturas, y cada asignatura admite recursos de estudio: cursos, vídeos, libros con resumen, lecturas, normas, datasets y herramientas.</p>" +
        '<button class="btn btn-p" id="empNew">+ Nuevo programa</button></div>';
      var e = document.getElementById("empNew");
      if (e) e.addEventListener("click", openCourseDialog);
      return;
    }
    if (state.view === "aula") {
      var fa = findAulaRes(c, state.aulaResId);
      if (!fa) { state.view = "course"; state.aulaResId = null; state.lessonId = null; }
      else {
        document.getElementById("crumb").innerHTML = "Campus / " + esc(c.code) + " / <b>Aula</b>";
        view.innerHTML = '<div class="body"><div class="body-in wide">' + renderAulaView(c) + "</div></div>";
        view.scrollTop = 0;
        return;
      }
    }

    var p = courseProgress(c);
    document.getElementById("crumb").innerHTML = "Campus / <b>" + esc(c.code) + "</b>";
    var tabs = [["plan", "Plan de estudios", c.modules.length], ["lib", "Biblioteca", allRes(c).length], ["dev", "Entregables", ""], ["set", "Ajustes", ""]];
    view.innerHTML =
      '<div class="hero"><div class="hero-in">' +
        '<div class="chiprow"><span class="chip brand">' + esc(c.code) + "</span>" +
        (c.level ? '<span class="chip">' + esc(c.level) + "</span>" : "") +
        (c.area ? '<span class="chip">' + esc(c.area) + "</span>" : "") + "</div>" +
        "<h1>" + esc(c.title) + "</h1>" +
        (c.subtitle ? '<p class="hero-sub">' + esc(c.subtitle) + "</p>" : "") +
        '<dl class="stats">' +
          stat("Asignaturas", c.modules.length) +
          stat("Semanas", c.weeks || "—") +
          stat("Dedicación", c.hoursWeek + " <small>h/sem</small>") +
          stat("Carga total", totalHours(c) + " <small>h</small>") +
          stat("Recursos", p.total) +
        "</dl>" +
        '<div class="pbar"><i style="width:' + p.pct + '%"></i></div>' +
        '<div class="pline">' + p.done + " de " + p.total + " recursos completados · " + p.pct + " %</div>" +
        '<div class="tabs">' + tabs.map(function (t) {
          return '<button class="tab' + (state.tab === t[0] ? " on" : "") + '" data-tab="' + t[0] + '">' + t[1] +
            (t[2] !== "" ? '<span class="n">' + t[2] + "</span>" : "") + "</button>";
        }).join("") + "</div>" +
      "</div></div>" +
      '<div class="body"><div class="body-in">' +
        (state.tab === "plan" ? renderPlan(c) :
         state.tab === "lib" ? renderLib(c) :
         state.tab === "dev" ? renderDeliv(c) : renderSettings(c)) +
      "</div></div>";
    wireSettings(c);
  }

  function stat(k, v) {
    return '<div class="stat"><dt>' + k + "</dt><dd>" + v + "</dd></div>";
  }

  function wireSettings(c) {
    var s = document.getElementById("saveSettings");
    if (!s) return;
    s.addEventListener("click", function () {
      c.code = document.getElementById("s-code").value.trim() || c.code;
      c.area = document.getElementById("s-area").value.trim();
      c.level = document.getElementById("s-level").value.trim();
      c.hoursWeek = Number(document.getElementById("s-hw").value) || c.hoursWeek;
      c.weeks = Number(document.getElementById("s-wk").value) || 0;
      c.title = document.getElementById("s-title").value.trim() || c.title;
      c.subtitle = document.getElementById("s-sub").value.trim();
      persistCourse(c); render(); toast("Programa actualizado");
    });
    document.getElementById("delCourse").addEventListener("click", function () {
      if (!confirm("¿Eliminar «" + c.title + "» y todas sus asignaturas?")) return;
      removeCourse(c.id);
      state.activeId = state.courses.length ? state.courses[0].id : null;
      render(); toast("Programa eliminado");
    });
    document.getElementById("resetProg").addEventListener("click", function () {
      if (!confirm("¿Reiniciar todo el progreso?")) return;
      state.progress = {}; persistProgress(); render(); toast("Progreso reiniciado");
    });
  }

  /* ==========================================================
     4. DIÁLOGOS
     ========================================================== */

  function openDialog(title, bodyHtml, onSave, saveLabel) {
    var ov = document.getElementById("ov");
    document.getElementById("dlg").innerHTML =
      '<div class="dlg-h"><h3>' + esc(title) + '</h3><button class="x" data-close="1" aria-label="Cerrar">✕</button></div>' +
      '<div class="dlg-b">' + bodyHtml + "</div>" +
      '<div class="dlg-f"><button class="btn" data-close="1">Cancelar</button>' +
      '<button class="btn btn-p" id="dlgSave">' + esc(saveLabel || "Guardar") + "</button></div>";
    ov.classList.add("on");
    document.getElementById("dlgSave").addEventListener("click", function () {
      if (onSave() !== false) closeDialog();
    });
    var first = ov.querySelector("input, textarea, select");
    if (first) first.focus();
  }
  function closeDialog() { document.getElementById("ov").classList.remove("on"); }

  function openCourseDialog() {
    openDialog("Nuevo programa",
      '<div class="grid2">' +
        fld("n-code", "Código", "") +
        fld("n-area", "Área", "") +
        fld("n-hw", "Horas por semana", "10", "number") +
        fld("n-wk", "Semanas", "", "number") +
        '<div class="fld wide"><label for="n-title">Título</label><input id="n-title" placeholder="Maestría en…"></div>' +
        '<div class="fld wide"><label for="n-sub">Descripción</label><textarea id="n-sub" placeholder="Objetivo del programa, a quién va dirigido, cómo se evalúa."></textarea></div>' +
      "</div>",
      function () {
        var t = document.getElementById("n-title").value.trim();
        if (!t) { toast("El título es obligatorio"); return false; }
        var c = normalize({
          code: document.getElementById("n-code").value.trim() || "PRG",
          title: t,
          subtitle: document.getElementById("n-sub").value.trim(),
          area: document.getElementById("n-area").value.trim(),
          hoursWeek: document.getElementById("n-hw").value,
          weeks: document.getElementById("n-wk").value,
          modules: []
        });
        state.courses.push(c);
        state.activeId = c.id; state.tab = "plan";
        persistCourse(c); render(); toast("Programa creado");
      }, "Crear programa");
  }

  function openModuleDialog(mod) {
    var c = active(); if (!c) return;
    var m = mod || { numeral: String(c.modules.length + 1), title: "", weeks: "", hours: "", objective: "", practice: "", deliverable: "", mastery: "" };
    openDialog(mod ? "Editar asignatura" : "Nueva asignatura",
      '<div class="grid2">' +
        fld("m-num", "Numeral", m.numeral) +
        fld("m-wk", "Semanas", m.weeks) +
        fld("m-h", "Horas", m.hours, "number") +
        '<div class="fld wide"><label for="m-t">Título</label><input id="m-t" value="' + esc(m.title) + '"></div>' +
        '<div class="fld wide"><label for="m-o">Objetivo</label><textarea id="m-o">' + esc(m.objective) + "</textarea></div>" +
        '<div class="fld wide"><label for="m-p">Práctica</label><textarea id="m-p">' + esc(m.practice) + "</textarea></div>" +
        '<div class="fld wide"><label for="m-d">Entregable</label><textarea id="m-d">' + esc(m.deliverable) + "</textarea></div>" +
        '<div class="fld wide"><label for="m-y">Criterio de dominio</label><textarea id="m-y">' + esc(m.mastery) + "</textarea></div>" +
      "</div>",
      function () {
        var t = document.getElementById("m-t").value.trim();
        if (!t) { toast("El título es obligatorio"); return false; }
        var target = mod;
        if (!target) { target = { id: uid("m"), resources: [] }; c.modules.push(target); }
        target.numeral = document.getElementById("m-num").value.trim() || "·";
        target.title = t;
        target.weeks = document.getElementById("m-wk").value.trim();
        target.hours = Number(document.getElementById("m-h").value) || 0;
        target.objective = document.getElementById("m-o").value.trim();
        target.practice = document.getElementById("m-p").value.trim();
        target.deliverable = document.getElementById("m-d").value.trim();
        target.mastery = document.getElementById("m-y").value.trim();
        state.open[target.id] = true;
        persistCourse(c); render(); toast(mod ? "Asignatura actualizada" : "Asignatura añadida");
      });
  }

  function openResourceDialog(modId, res) {
    var c = active(); if (!c) return;
    var mod = null;
    c.modules.forEach(function (m) {
      if (m.id === modId) mod = m;
      if (!modId && res) m.resources.forEach(function (r) { if (r.id === res.id) mod = m; });
    });
    if (!mod) return;
    var r = res || { t: "curso", n: "", s: "", u: "", m: "", r: "" };
    var opts = TYPE_ORDER.map(function (t) {
      return '<option value="' + t + '"' + (r.t === t ? " selected" : "") + ">" + TYPES[t] + "</option>";
    }).join("");
    openDialog(res ? "Editar recurso" : "Nuevo recurso",
      '<div class="grid2">' +
        '<div class="fld"><label for="r-t">Tipo</label><select id="r-t">' + opts + "</select></div>" +
        fld("r-m", "Duración / extensión", r.m) +
        '<div class="fld wide"><label for="r-n">Título</label><input id="r-n" value="' + esc(r.n) + '"></div>' +
        '<div class="fld wide"><label for="r-s">Autor o fuente</label><input id="r-s" value="' + esc(r.s) + '"></div>' +
        '<div class="fld wide"><label for="r-u">Enlace</label><input id="r-u" type="url" placeholder="https://…" value="' + esc(r.u) + '"></div>' +
        '<div class="fld wide"><label for="r-r">Resumen (para libros y lecturas largas)</label><textarea id="r-r" placeholder="Qué sostiene, qué te llevas, cuándo leerlo.">' + esc(r.r) + "</textarea></div>" +
      "</div>",
      function () {
        var n = document.getElementById("r-n").value.trim();
        if (!n) { toast("El título es obligatorio"); return false; }
        var target = res;
        if (!target) { target = { id: uid("r") }; mod.resources.push(target); }
        target.t = document.getElementById("r-t").value;
        target.n = n;
        target.s = document.getElementById("r-s").value.trim();
        target.u = document.getElementById("r-u").value.trim();
        target.m = document.getElementById("r-m").value.trim();
        target.r = document.getElementById("r-r").value.trim();
        state.open[mod.id] = true;
        persistCourse(c); render(); toast(res ? "Recurso actualizado" : "Recurso añadido");
      });
  }

  /* ==========================================================
     4a-bis. AULAS: navegación, lección, quiz y examen
     ========================================================== */

  function findAulaRes(c, resId) {
    var found = null;
    (c ? c.modules : []).forEach(function (m) {
      m.resources.forEach(function (r) { if (r.id === resId && r.aula) found = { mod: m, res: r }; });
    });
    return found;
  }
  function aulaLessons(aula) {
    var out = [];
    aula.units.forEach(function (u) { u.lessons.forEach(function (L) { out.push({ unit: u, lesson: L }); }); });
    return out;
  }
  function lessonDone(L) { return !!state.progress["L::" + L.id]; }
  function aulaProgress(aula) {
    var all = aulaLessons(aula), d = 0;
    all.forEach(function (x) { if (lessonDone(x.lesson)) d++; });
    return { done: d, total: all.length, pct: all.length ? Math.round(d / all.length * 100) : 0 };
  }

  function renderAulaView(c) {
    var f = findAulaRes(c, state.aulaResId);
    if (!f) return "";
    var res = f.res, aula = res.aula, p = aulaProgress(aula);

    var current = null;
    if (state.lessonId) {
      aulaLessons(aula).forEach(function (x) { if (x.lesson.id === state.lessonId) current = x; });
    }

    var outline = aula.units.map(function (u, i) {
      var open = state.openUnit[u.id] !== undefined ? state.openUnit[u.id] : (current ? current.unit.id === u.id : i === 0);
      var ud = u.lessons.filter(lessonDone).length;
      var items = u.lessons.map(function (L) {
        var on = current && current.lesson.id === L.id;
        return '<button class="u-l' + (on ? " on" : "") + (lessonDone(L) ? " done" : "") + '" data-lesson="' + esc(L.id) + '">' +
          '<span class="u-l-tick" aria-hidden="true"></span>' +
          '<span class="u-l-t">' + esc(L.title) + "</span>" +
          '<span class="u-l-m">' + (L.mins || 0) + " min</span></button>";
      }).join("");
      var examBtn = u.exam ? '<button class="u-l u-l-exam' + (state.exams[u.id] ? " done" : "") + (current === null && state.lessonId === "exam::" + u.id ? " on" : "") + '" data-lesson="exam::' + esc(u.id) + '">' +
        '<span class="u-l-tick" aria-hidden="true"></span><span class="u-l-t">Examen de la unidad</span>' +
        '<span class="u-l-m">' + (state.exams[u.id] ? (Number(state.exams[u.id].nota) || 0).toFixed(1) : "10 preg.") + "</span></button>" : "";
      return '<div class="u' + (open ? " open" : "") + (u.ready ? "" : " soon") + '">' +
        '<button class="u-h" data-unit="' + esc(u.id) + '" aria-expanded="' + open + '">' +
          "<div><div class=\"u-t\">" + esc(u.title) + "</div>" +
          '<div class="u-s">' + esc(u.n) + " · " + (u.hours ? u.hours + (u.hours === 1 ? " hora" : " horas") + " para finalizar" : "por definir") +
          (u.ready ? " · " + ud + "/" + u.lessons.length : " · en preparación") + "</div></div>" +
          '<span class="u-chev" aria-hidden="true"></span>' +
        "</button>" +
        '<div class="u-b">' + items + examBtn + "</div></div>";
    }).join("");

    var main;
    if (state.lessonId && state.lessonId.indexOf("exam::") === 0) {
      var uid3 = state.lessonId.slice(6), unit = null;
      aula.units.forEach(function (u) { if (u.id === uid3) unit = u; });
      main = unit ? renderExam(unit) : "";
    } else if (current) {
      main = current.lesson.ready ? renderLesson(aula, current.unit, current.lesson) : renderSoon(aula, current.lesson.title);
    } else {
      main = renderAulaHome(res, aula, p);
    }

    return '<div class="crumb"><button class="lnk" data-back-course="1">← ' + esc(c.code) + " · " + esc(f.mod.numeral) + "</button>" +
      '<span class="crumb-s">/</span><span>' + esc(res.n) + "</span></div>" +
      '<div class="aula">' +
        '<aside class="aula-side">' +
          '<div class="aula-side-h"><div class="aula-n">' + esc(res.n) + "</div>" +
          '<div class="aula-p"><div class="aula-bar"><i style="width:' + p.pct + '%"></i></div>' +
          '<span>' + p.done + "/" + p.total + " lecciones</span></div></div>" +
          outline +
        "</aside>" +
        '<div class="aula-main">' + main + "</div>" +
      "</div>";
  }

  function renderAulaHome(res, aula, p) {
    var first = null;
    aulaLessons(aula).forEach(function (x) { if (!first && x.lesson.ready) first = x.lesson; });
    return '<div class="card"><h2 class="aula-title">' + esc(res.n) + "</h2>" +
      '<p class="aula-lead">' + esc(aula.note) + "</p>" +
      '<div class="aula-att"><span class="k">Atribución</span>' + esc(aula.source) +
      (aula.url ? ' · <a href="' + esc(aula.url) + '" target="_blank" rel="noopener noreferrer">Curso original</a>' : "") + "</div>" +
      '<div class="aula-stats"><div><b>' + aula.units.length + "</b><span>unidades</span></div>" +
      "<div><b>" + p.total + "</b><span>lecciones</span></div>" +
      "<div><b>" + aula.units.reduce(function (a, u) { return a + (u.hours || 0); }, 0) + "</b><span>horas</span></div>" +
      "<div><b>" + p.pct + " %</b><span>completado</span></div></div>" +
      (first ? '<div class="actions"><button class="btn btn-p" data-lesson="' + esc(first.id) + '">Comenzar la primera lección</button></div>' : "") +
      "</div>";
  }

  function renderSoon(aula, title) {
    return '<div class="card soon-card"><h2 class="aula-title">' + esc(title) + "</h2>" +
      "<p>El contenido escrito de esta lección todavía no está publicado en el campus. La estructura de la unidad ya está definida y puedes seguirla en el curso original mientras tanto.</p>" +
      (aula.url ? '<div class="actions"><a class="btn" href="' + esc(aula.url) + '" target="_blank" rel="noopener noreferrer">Abrir el curso original</a></div>' : "") +
      "</div>";
  }

  function stripOk(s) {
    var t = String(s).replace(/^Correcto[:.]\s*/i, "");
    return t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
  }

  function quizBlock(L) {
    if (!L.quiz || !L.quiz.length) return "";
    return '<div class="quiz"><div class="lbl">Autoevaluación</div>' +
      L.quiz.map(function (Q, qi) {
        var key = L.id + "-q" + qi;
        var pick = state.quizzes[key];
        var answered = pick !== undefined && pick !== null;
        return '<div class="q"><div class="q-t">' + (qi + 1) + ". " + esc(Q.q) + "</div>" +
          Q.opts.map(function (o, oi) {
            var cls = "";
            if (answered) {
              if (oi === Q.a) cls = " ok";
              else if (oi === pick) cls = " no";
              else cls = " off";
            }
            return '<button class="q-o' + cls + '" data-quiz-opt="' + esc(key) + '|' + oi + '"' + (answered ? " disabled" : "") + ">" +
              '<span class="q-b">' + String.fromCharCode(65 + oi) + "</span>" + esc(o) + "</button>";
          }).join("") +
          (answered ? '<div class="q-w' + (pick === Q.a ? " ok" : " no") + '">' +
            "<b>" + (pick === Q.a ? "Correcto." : "Incorrecto.") + "</b> " +
            esc(stripOk((Q.why && Q.why[pick]) || "")) +
            (pick !== Q.a ? "<br><b>Respuesta correcta — " + esc(Q.opts[Q.a]) + ".</b> " +
              esc(stripOk((Q.why && Q.why[Q.a]) || "")) : "") +
            "</div>" : "") +
          "</div>";
      }).join("") + "</div>";
  }

  function renderLesson(aula, unit, L) {
    var all = aulaLessons(aula), idx = -1;
    all.forEach(function (x, i) { if (x.lesson.id === L.id) idx = i; });
    var prev = idx > 0 ? all[idx - 1].lesson : null;
    var next = idx >= 0 && idx < all.length - 1 ? all[idx + 1].lesson : null;
    var done = lessonDone(L);

    return '<article class="les">' +
      '<div class="les-h"><div class="les-u">' + esc(unit.n) + " · " + esc(unit.title) + "</div>" +
      "<h2>" + esc(L.title) + "</h2>" +
      '<div class="les-m">' + (L.mins || 0) + " min de lectura · lección " + (idx + 1) + " de " + all.length + "</div></div>" +
      '<div class="les-b">' + (L.body || []).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + "</div>" +
      (L.example ? '<div class="les-box ex"><span class="k">' + esc(L.example.title) + "</span><p>" + esc(L.example.text) + "</p></div>" : "") +
      (L.keys ? '<div class="les-keys"><div class="lbl">Puntos clave</div><ul>' +
        L.keys.map(function (k) { return "<li>" + esc(k) + "</li>"; }).join("") + "</ul></div>" : "") +
      (L.exercise ? '<div class="les-box exr"><span class="k">Ejercicio · ' + (L.exercise.mins || 0) + ' min</span><p>' + esc(L.exercise.text) + "</p></div>" : "") +
      quizBlock(L) +
      '<div class="les-nav">' +
        (prev ? '<button class="btn" data-lesson="' + esc(prev.id) + '">← Anterior</button>' : '<span></span>') +
        '<button class="btn' + (done ? "" : " btn-p") + '" data-lesson-done="' + esc(L.id) + '">' +
          (done ? "Completada ✓" : "Marcar como completada") + "</button>" +
        (next ? '<button class="btn btn-p" data-lesson="' + esc(next.id) + '">Siguiente →</button>' : '<span></span>') +
      "</div></article>";
  }

  function renderExam(unit) {
    var saved = state.exams[unit.id];
    var draft = state.examDraft[unit.id] || {};
    var qs = unit.exam || [];

    if (saved) {
      return '<article class="les"><div class="les-h"><div class="les-u">' + esc(unit.n) + " · " + esc(unit.title) + "</div>" +
        "<h2>Examen de la unidad</h2></div>" +
        '<div class="grade"><div class="grade-h">' +
        '<div class="grade-n ' + gradeClass(saved.nota) + '">' + Number(saved.nota).toFixed(1) + "<small>/ 5.0</small></div>" +
        '<div class="grade-meta"><div class="grade-v ' + gradeClass(saved.nota) + '">' +
        (saved.nota >= 3 ? "aprobado" : "no aprobado") + "</div>" +
        '<div class="grade-s">' + saved.score + " de " + saved.total + " correctas · " +
        esc(new Date(saved.at).toLocaleString("es-CO")) + "</div></div></div></div>" +
        '<div class="exam-rev"><div class="lbl">Revisión</div>' +
        qs.map(function (Q, qi) {
          var pick = saved.answers[qi], ok = pick === Q.a;
          return '<div class="q"><div class="q-t">' + (qi + 1) + ". " + esc(Q.q) + "</div>" +
            '<div class="q-w' + (ok ? " ok" : " no") + '"><b>' + (ok ? "Correcto — " : "Fallaste. La correcta era: ") +
            esc(Q.opts[Q.a]) + ".</b> " + esc(stripOk((Q.why && Q.why[Q.a]) || "")) +
            (!ok ? "<br>Marcaste «" + esc(Q.opts[pick] !== undefined ? Q.opts[pick] : "sin responder") + "»: " + esc(stripOk((Q.why && Q.why[pick]) || "")) : "") +
            "</div></div>";
        }).join("") + "</div>" +
        '<div class="les-nav"><span></span><button class="btn btn-d" data-exam-reset="' + esc(unit.id) + '">Repetir examen</button><span></span></div>' +
        "</article>";
    }

    var answered = Object.keys(draft).length;
    return '<article class="les"><div class="les-h"><div class="les-u">' + esc(unit.n) + " · " + esc(unit.title) + "</div>" +
      "<h2>Examen de la unidad</h2>" +
      '<div class="les-m">' + qs.length + " preguntas · se aprueba con 3.0 · " + answered + " respondidas</div></div>" +
      '<div class="quiz">' + qs.map(function (Q, qi) {
        return '<div class="q"><div class="q-t">' + (qi + 1) + ". " + esc(Q.q) + "</div>" +
          Q.opts.map(function (o, oi) {
            return '<button class="q-o' + (draft[qi] === oi ? " pick" : "") + '" data-exam-opt="' + esc(unit.id) + "|" + qi + "|" + oi + '">' +
              '<span class="q-b">' + String.fromCharCode(65 + oi) + "</span>" + esc(o) + "</button>";
          }).join("") + "</div>";
      }).join("") + "</div>" +
      '<div class="les-nav"><span></span><button class="btn btn-p" data-exam-submit="' + esc(unit.id) + '"' +
      (answered < qs.length ? " disabled" : "") + ">" +
      (answered < qs.length ? "Faltan " + (qs.length - answered) + " respuestas" : "Entregar examen") + "</button><span></span></div>" +
      "</article>";
  }

  function submitExam(unitId) {
    var c = active(), f = findAulaRes(c, state.aulaResId);
    if (!f) return;
    var unit = null;
    f.res.aula.units.forEach(function (u) { if (u.id === unitId) unit = u; });
    if (!unit || !unit.exam) return;
    var draft = state.examDraft[unitId] || {}, score = 0, answers = [];
    unit.exam.forEach(function (Q, qi) {
      answers.push(draft[qi]);
      if (draft[qi] === Q.a) score++;
    });
    var nota = Math.round((score / unit.exam.length) * 50) / 10;
    state.exams[unitId] = { nota: nota, score: score, total: unit.exam.length, answers: answers, at: new Date().toISOString() };
    delete state.examDraft[unitId];
    persistExams(); render();
    toast("Examen entregado · nota " + nota.toFixed(1) + " (" + score + "/" + unit.exam.length + ")");
  }

  function persistQuiz() {
    saveLocal();
    if (!db) return;
    db.doc("quizzes/main").set({ items: state.quizzes })["catch"](function () {});
  }
  function persistExams() {
    saveLocal();
    if (!db) return;
    db.doc("exams/main").set({ items: state.exams })["catch"](function () {});
  }

  /* ==========================================================
     4b. ENTREGA Y CALIFICACIÓN
     ========================================================== */

  function persistSub(modId) {
    var s = state.subs[modId];
    saveLocal();
    if (!db || !s) return;
    db.doc("submissions/" + modId).set({
      courseId: state.activeId, name: s.name || "", link: s.link || "",
      text: String(s.text || "").slice(0, 50000), chars: s.chars || 0, at: s.at || new Date().toISOString()
    })["catch"](function (e) { toast("No se pudo guardar la entrega: " + e.code); });
  }
  function persistGrade(modId) {
    var g = state.grades[modId];
    saveLocal();
    if (!db) return;
    var ref = db.doc("grades/" + modId);
    if (!g) { ref["delete"]()["catch"](function () {}); return; }
    ref.set(JSON.parse(JSON.stringify(g)))["catch"](function (e) { toast("No se pudo guardar la nota: " + e.code); });
  }

  async function extractText(file) {
    var name = (file.name || "").toLowerCase();
    if (name.slice(-4) === ".pdf") {
      if (!window.pdfjsLib) throw new Error("El lector de PDF no cargó. Pega el texto manualmente.");
      var lib = window.pdfjsLib;
      try {
        lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      } catch (e) { /* sin worker: pdf.js usa el hilo principal */ }
      var buf = await file.arrayBuffer();
      var doc = await lib.getDocument({ data: buf }).promise;
      var pages = [];
      var n = Math.min(doc.numPages, 300);
      for (var i = 1; i <= n; i++) {
        var pg = await doc.getPage(i);
        var tc = await pg.getTextContent();
        pages.push(tc.items.map(function (it) { return it.str; }).join(" "));
      }
      var out = pages.join("\n\n").replace(/[ \t]+/g, " ").trim();
      if (!out) throw new Error("El PDF no contiene texto seleccionable (parece escaneado). Pega el texto manualmente.");
      return out;
    }
    return await file.text();
  }

  function buildPrompt(course, mod, sub) {
    return "Eres el evaluador de un programa de posgrado y calificas el entregable de un estudiante. " +
      "Sé exigente: es nivel de maestría, no un curso introductorio.\n\n" +
      "PROGRAMA: " + course.title + "\n" +
      "ASIGNATURA " + mod.numeral + ": " + mod.title + "\n" +
      "OBJETIVO DE LA ASIGNATURA: " + (mod.objective || "no especificado") + "\n" +
      "ENTREGABLE SOLICITADO: " + (mod.deliverable || "no especificado") + "\n" +
      "CRITERIO DE DOMINIO QUE DEBE DEMOSTRAR: " + (mod.mastery || "no especificado") + "\n" +
      (sub.link ? "ENLACE APORTADO POR EL ESTUDIANTE: " + sub.link + " (no puedes abrirlo; tenlo en cuenta solo como declaración)\n" : "") +
      "\nRÚBRICA — puntúa cada criterio de 0 a 100:\n" +
      "1. cumplimiento (peso 25): ¿entrega lo que se pidió, completo y en el formato indicado?\n" +
      "2. rigor (peso 25): ¿los métodos son correctos y las conclusiones se sostienen sobre lo presentado?\n" +
      "3. evidencia (peso 20): ¿hay datos, métricas y mediciones concretas, en lugar de afirmaciones?\n" +
      "4. aplicacion (peso 15): ¿se aplica a un contexto profesional real y concreto?\n" +
      "5. comunicacion (peso 15): ¿estructura legible, fuentes citadas, figuras que aportan?\n\n" +
      "TRABAJO DEL ESTUDIANTE" + (sub.truncated ? " (TRUNCADO: solo recibes el principio)" : "") + ":\n\"\"\"\n" +
      sub.text + "\n\"\"\"\n\n" +
      "Si el texto está vacío, es trivial o no corresponde al entregable pedido, dilo y califica bajo; no seas condescendiente.\n" +
      "Responde SOLO con un objeto JSON válido, sin texto alrededor y sin bloque de código, con esta forma exacta:\n" +
      '{"nota": número 0.0-5.0 con un decimal, "porcentaje": entero 0-100, "veredicto": "aprobado" o "no aprobado", ' +
      '"criterios": [{"clave":"cumplimiento","nombre":"Cumplimiento del entregable","peso":25,"puntaje":0-100,"comentario":"1-2 frases"}, ' +
      '{"clave":"rigor","nombre":"Rigor técnico","peso":25,"puntaje":0-100,"comentario":"..."}, ' +
      '{"clave":"evidencia","nombre":"Evidencia y evaluación","peso":20,"puntaje":0-100,"comentario":"..."}, ' +
      '{"clave":"aplicacion","nombre":"Aplicación profesional","peso":15,"puntaje":0-100,"comentario":"..."}, ' +
      '{"clave":"comunicacion","nombre":"Claridad y citación","peso":15,"puntaje":0-100,"comentario":"..."}], ' +
      '"fortalezas": ["2 a 4 frases concretas"], "debilidades": ["2 a 4 frases concretas"], ' +
      '"acciones": ["3 a 5 acciones concretas para subir la nota"], "resumen": "2 o 3 frases de veredicto global"}\n' +
      "La nota debe ser coherente con el porcentaje (porcentaje/20). Aprobado desde 3.0. Escribe todo en español.";
  }

  function readSubFromForm(modId) {
    var ta = document.querySelector('[data-text="' + modId + '"]');
    var lk = document.getElementById("lk-" + modId);
    var cur = state.subs[modId] || {};
    var text = ta ? ta.value : (cur.text || "");
    var s = {
      name: cur.name || "",
      link: lk ? lk.value.trim() : (cur.link || ""),
      text: text,
      chars: text.length,
      at: new Date().toISOString()
    };
    if (ta && cur.text !== undefined && ta.value !== cur.text) s.name = "";
    state.subs[modId] = s;
    return s;
  }

  async function gradeModule(modId) {
    var c = active(); if (!c || !sampler) return;
    var mod = null;
    c.modules.forEach(function (m) { if (m.id === modId) mod = m; });
    if (!mod) return;

    var sub = readSubFromForm(modId);
    if (!sub.text || sub.text.trim().length < 200) {
      toast("Carga o pega al menos 200 caracteres del trabajo");
      return;
    }
    persistSub(modId);

    var payload = { text: sub.text.slice(0, MAX_TEXT), link: sub.link, truncated: sub.text.length > MAX_TEXT };
    var zone = document.getElementById("gz-" + modId);
    var btn = document.querySelector('[data-grade="' + modId + '"]');
    if (btn) { btn.disabled = true; btn.textContent = "Calificando…"; }
    if (zone) zone.innerHTML = '<div class="grading"><span class="spin"></span>Leyendo el trabajo y aplicando la rúbrica. Esto tarda entre 20 y 60 segundos.</div>';

    try {
      var g = await sampler.json(buildPrompt(c, mod, payload), { modelTier: "complex" });
      if (!g || typeof g !== "object" || g.nota == null) throw { code: "bad_shape", message: "Respuesta no interpretable" };
      g.nota = Math.max(0, Math.min(5, Number(g.nota) || 0));
      g.porcentaje = g.porcentaje != null ? Math.max(0, Math.min(100, Math.round(Number(g.porcentaje)))) : Math.round(g.nota * 20);
      g.veredicto = g.nota >= 3 ? "aprobado" : "no aprobado";
      g.criterios = Array.isArray(g.criterios) ? g.criterios : [];
      g.at = new Date().toISOString();
      g.courseId = c.id;
      g.moduleId = modId;
      g.fuente = { nombre: sub.name || "texto pegado", chars: payload.text.length, truncado: payload.truncated };
      state.grades[modId] = g;
      persistGrade(modId);
      if (zone) zone.innerHTML = gradeCard(g);
      toast("Nota " + g.nota.toFixed(1) + " · " + g.veredicto);
      renderNav();
    } catch (e) {
      var code = (e && e.code) || "error";
      var msg = code === "not_granted" ? "La calificación con IA no está habilitada en esta vista."
        : code === "rate_limited" ? "Demasiadas solicitudes seguidas. Espera un minuto y reinténtalo."
        : code === "bad_shape" ? "El evaluador no devolvió una calificación interpretable. Reinténtalo."
        : "No se pudo calificar (" + code + ").";
      if (zone) zone.innerHTML = '<div class="grading err">' + esc(msg) + "</div>";
      toast(msg);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = state.grades[modId] ? "Volver a calificar" : "Calificar con IA"; }
    }
  }

  /* ==========================================================
     5. EVENTOS
     ========================================================== */

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest ? ev.target.closest("[data-course],[data-tab],[data-toggle],[data-sum],[data-f],[data-add-res],[data-edit-res],[data-add-mod],[data-edit-mod],[data-del-mod],[data-close],[data-dv-toggle],[data-save-sub],[data-grade],[data-ungrade],[data-aula],[data-lesson],[data-unit],[data-quiz-opt],[data-exam-opt],[data-exam-submit],[data-exam-reset],[data-lesson-done],[data-back-course]") : null;
    if (!el) return;
    var c = active();

    if (el.dataset.aula) {
      state.view = "aula"; state.aulaResId = el.dataset.aula;
      state.lessonId = null; state.openUnit = {};
      render(); return;
    }
    if (el.dataset.backCourse) {
      state.view = "course"; state.aulaResId = null; state.lessonId = null;
      render(); return;
    }
    if (el.dataset.unit) {
      var u = el.dataset.unit;
      state.openUnit[u] = !(state.openUnit[u] !== undefined ? state.openUnit[u] : true);
      render(); return;
    }
    if (el.dataset.lesson) { state.lessonId = el.dataset.lesson; render(); return; }
    if (el.dataset.lessonDone) {
      var lk = "L::" + el.dataset.lessonDone;
      if (state.progress[lk]) delete state.progress[lk]; else state.progress[lk] = true;
      persistProgress(); render(); return;
    }
    if (el.dataset.quizOpt) {
      var qp = el.dataset.quizOpt.split("|");
      if (state.quizzes[qp[0]] === undefined) {
        state.quizzes[qp[0]] = Number(qp[1]);
        persistQuiz(); render();
      }
      return;
    }
    if (el.dataset.examOpt) {
      var ep = el.dataset.examOpt.split("|");
      if (!state.examDraft[ep[0]]) state.examDraft[ep[0]] = {};
      state.examDraft[ep[0]][Number(ep[1])] = Number(ep[2]);
      render(); return;
    }
    if (el.dataset.examSubmit) {
      submitExam(el.dataset.examSubmit); return;
    }
    if (el.dataset.examReset) {
      delete state.exams[el.dataset.examReset];
      delete state.examDraft[el.dataset.examReset];
      persistExams(); render(); return;
    }

    if (el.dataset.dvToggle) {
      var did = el.dataset.dvToggle;
      if (state.openDv[did]) { readSubFromForm(did); delete state.openDv[did]; }
      else state.openDv[did] = true;
      render(); return;
    }
    if (el.dataset.saveSub) {
      readSubFromForm(el.dataset.saveSub); persistSub(el.dataset.saveSub);
      render(); toast("Entrega guardada"); return;
    }
    if (el.dataset.grade) { gradeModule(el.dataset.grade); return; }
    if (el.dataset.ungrade) {
      if (!confirm("¿Borrar la calificación de esta asignatura?")) return;
      delete state.grades[el.dataset.ungrade];
      persistGrade(el.dataset.ungrade); render(); toast("Calificación borrada"); return;
    }
    if (el.dataset.close) { closeDialog(); return; }
    if (el.dataset.course) { state.activeId = el.dataset.course; state.tab = "plan"; render(); return; }
    if (el.dataset.tab) { state.tab = el.dataset.tab; render(); return; }
    if (el.dataset.f) { state.filter = el.dataset.f; render(); return; }
    if (el.dataset.toggle) {
      var id = el.dataset.toggle;
      state.open[id] = !state.open[id];
      var art = document.querySelector('[data-mod="' + id + '"]');
      if (art) { art.classList.toggle("open", !!state.open[id]); el.setAttribute("aria-expanded", state.open[id] ? "true" : "false"); }
      return;
    }
    if (el.dataset.sum) {
      var row = document.querySelector('[data-rid="' + el.dataset.sum + '"]');
      if (row) row.classList.toggle("sum-open");
      return;
    }
    if (el.dataset.addRes) { openResourceDialog(el.dataset.addRes, null); return; }
    if (el.dataset.addMod) { openModuleDialog(null); return; }
    if (el.dataset.editMod && c) {
      c.modules.forEach(function (m) { if (m.id === el.dataset.editMod) openModuleDialog(m); });
      return;
    }
    if (el.dataset.delMod && c) {
      var mm = null;
      c.modules.forEach(function (m) { if (m.id === el.dataset.delMod) mm = m; });
      if (mm && confirm("¿Eliminar la asignatura «" + mm.title + "»?")) {
        c.modules = c.modules.filter(function (m) { return m.id !== mm.id; });
        persistCourse(c); render(); toast("Asignatura eliminada");
      }
      return;
    }
    if (el.dataset.editRes && c) {
      c.modules.forEach(function (m) {
        m.resources.forEach(function (r) { if (r.id === el.dataset.editRes) openResourceDialog(m.id, r); });
      });
      return;
    }
  });

  document.addEventListener("change", async function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.file) {
      var modId = t.dataset.file;
      var file = t.files && t.files[0];
      if (!file) return;
      var st = document.getElementById("st-" + modId);
      if (st) st.textContent = "Leyendo " + file.name + "…";
      try {
        var text = await extractText(file);
        var ta = document.querySelector('[data-text="' + modId + '"]');
        if (ta) ta.value = text;
        state.subs[modId] = {
          name: file.name, link: (document.getElementById("lk-" + modId) || {}).value || "",
          text: text, chars: text.length, at: new Date().toISOString()
        };
        persistSub(modId);
        if (st) st.textContent = file.name + " · " + text.length.toLocaleString("es-CO") + " caracteres";
        toast("Archivo leído: " + text.length.toLocaleString("es-CO") + " caracteres");
      } catch (e) {
        if (st) st.textContent = "No se pudo leer el archivo";
        toast(e && e.message ? e.message : "No se pudo leer el archivo");
      }
      return;
    }
    if (t.dataset && t.dataset.check) {
      if (t.checked) state.progress[t.dataset.check] = true;
      else delete state.progress[t.dataset.check];
      persistProgress();
      var row = t.closest(".r");
      if (row) row.classList.toggle("done", t.checked);
      renderNav();
      var c = active();
      if (c) {
        var p = courseProgress(c);
        var bar = document.querySelector(".pbar i"), line = document.querySelector(".pline");
        if (bar) bar.style.width = p.pct + "%";
        if (line) line.textContent = p.done + " de " + p.total + " recursos completados · " + p.pct + " %";
        var mod = t.closest(".mod");
        if (mod) {
          c.modules.forEach(function (m) {
            if (m.id === mod.dataset.mod) {
              var mp = modProgress(m);
              var holder = mod.querySelector(".mod-r");
              if (holder) holder.innerHTML = ring(mp.pct) + '<span class="caret">▶</span>';
            }
          });
        }
      }
    }
  });

  document.getElementById("q").addEventListener("input", function (e) {
    state.query = e.target.value; renderNav();
  });
  document.getElementById("newCourse").addEventListener("click", openCourseDialog);
  document.getElementById("ov").addEventListener("click", function (e) {
    if (e.target.id === "ov") closeDialog();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDialog(); });

  document.getElementById("themeBtn").addEventListener("click", function () {
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
    if (next) root.setAttribute("data-theme", next); else root.removeAttribute("data-theme");
    toast(next === "dark" ? "Tema oscuro" : next === "light" ? "Tema claro" : "Tema del sistema");
  });

  document.getElementById("exportBtn").addEventListener("click", function () {
    var payload = JSON.stringify({ courses: state.courses, progress: state.progress }, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload).then(function () {
        toast("Catálogo copiado al portapapeles");
      }, function () { toast("No se pudo copiar"); });
    } else { toast("Portapapeles no disponible"); }
  });

  /* ==========================================================
     6. ARRANQUE
     ========================================================== */

  function boot(local) {
    var courses = local && local.courses && local.courses.length ? local.courses : [TEMPLATE];
    state.courses = courses.map(normalize);
    state.progress = (local && local.progress) || {};
    state.subs = (local && local.subs) || {};
    state.grades = (local && local.grades) || {};
    state.quizzes = (local && local.quizzes) || {};
    state.exams = (local && local.exams) || {};
    if (!state.activeId && state.courses.length) state.activeId = state.courses[0].id;
    render();
  }

  boot(loadLocal());

  function setSync(text, live) {
    document.getElementById("sync").textContent = text;
    document.getElementById("sdot").classList.toggle("live", !!live);
  }
  setSync("Solo en este navegador");

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (store) {
      if (!store) { setSync("Solo en este navegador"); return; }
      db = store;
      setSync("Sincronizado", true);

      db.collection("courses").onSnapshot(function (snap) {
        if (snap.empty) {
          // Primera apertura: sube el programa base al almacén para que sea editable.
          var seed = normalize(TEMPLATE);
          db.collection("courses").doc(seed.id).set(JSON.parse(JSON.stringify(seed)))["catch"](function () {});
          return;
        }
        var list = [];
        snap.docs.forEach(function (d) {
          var body = d.data() || {};
          body.id = d.id;
          list.push(normalize(body));
        });
        state.courses = list;
        if (!active()) state.activeId = list.length ? list[0].id : null;
        saveLocal();
        render();
      }, function (e) { setSync("Sin sincronizar (" + e.code + ")"); });

      db.doc("progress/main").onSnapshot(function (d) {
        if (!d.exists) return;
        var items = (d.data() || {}).items;
        if (items && typeof items === "object") { state.progress = items; saveLocal(); render(); }
      }, function () {});

      db.doc("quizzes/main").onSnapshot(function (d) {
        if (!d.exists) return;
        var it = (d.data() || {}).items;
        if (it && typeof it === "object") { state.quizzes = it; saveLocal(); if (state.view === "aula") render(); }
      }, function () {});

      db.doc("exams/main").onSnapshot(function (d) {
        if (!d.exists) return;
        var it = (d.data() || {}).items;
        if (it && typeof it === "object") { state.exams = it; saveLocal(); if (state.view === "aula") render(); }
      }, function () {});

      db.collection("grades").onSnapshot(function (snap) {
        var g = {};
        snap.docs.forEach(function (d) { g[d.id] = d.data() || {}; });
        state.grades = g; saveLocal();
        if (state.tab === "dev") render(); else renderNav();
      }, function () {});

      db.collection("submissions").onSnapshot(function (snap) {
        var s = {};
        snap.docs.forEach(function (d) { s[d.id] = d.data() || {}; });
        // No pisar lo que el usuario esté escribiendo en un panel abierto.
        Object.keys(state.openDv).forEach(function (k) { if (state.subs[k]) s[k] = state.subs[k]; });
        state.subs = s; saveLocal();
        if (state.tab === "dev") render();
      }, function () {});
    })["catch"](function () { setSync("Solo en este navegador"); });

    window.claude.use("sample").then(function (s) {
      if (!s) return;
      sampler = s;
      if (state.tab === "dev") render();
    })["catch"](function () {});
  }
})();
</script>
