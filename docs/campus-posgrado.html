<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Campus Posgrado — Plataforma académica de excelencia">
  <title>Campus Posgrado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* =====================================================
     CAMPUS POSGRADO — DESIGN SYSTEM ÉLITE
     Inspirado en plataformas académicas internacionales
     ===================================================== */
  :root {
    /* — Colores institucionales — */
    --accent:        #C41230;   /* Rojo institución — único acento */
    --accent-hover:  #A50F28;
    --accent-soft:   #FDF2F4;
    --accent-mid:    #F5D5DB;
    --accent-ink:    #C41230;
    --on-accent:     #FFFFFF;

    /* — Neutros sofisticados — */
    --bg:        #F4F5F8;
    --surface:   #FFFFFF;
    --surface-2: #F0F1F5;
    --surface-3: #FAFBFC;
    --border:    #E3E5EC;
    --border-2:  #C8CBD6;

    /* — Tipografía — */
    --ink:   #0F1117;
    --ink-2: #3A3F50;
    --ink-3: #6B7080;
    --ink-4: #9EA4B0;

    /* — Semáforo de estado — */
    --ok:       #1A6B4A;
    --ok-soft:  #EAF4EF;
    --info:     #1D4C8F;
    --info-soft:#E8EFF9;
    --warn:     #8A5300;
    --warn-soft:#FFF3E0;
    --violet:   #4A3A7A;
    --violet-soft:#EDE9F7;
    --teal:     #136060;
    --teal-soft:#E0EFEF;

    /* — Fuentes — */
    --serif: 'Playfair Display', 'Spectral', Georgia, 'Times New Roman', serif;
    --sans:  'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono:  'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace;

    /* — Radios — */
    --r-xs: 3px;
    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-xl: 20px;
    --r-pill: 999px;

    /* — Sombras — */
    --shadow-xs: 0 1px 2px rgba(15,17,23,.04);
    --shadow-sm: 0 1px 3px rgba(15,17,23,.05), 0 4px 16px -6px rgba(15,17,23,.08);
    --shadow-md: 0 2px 8px rgba(15,17,23,.06), 0 12px 32px -10px rgba(15,17,23,.12);
    --shadow-lg: 0 8px 40px -12px rgba(15,17,23,.20);

    /* — Transiciones — */
    --t-fast:   100ms ease;
    --t-base:   200ms ease;
    --t-slow:   350ms ease;
  }

  /* — Tema oscuro — */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --accent:       #E8637A;
      --accent-hover: #F08090;
      --accent-soft:  #2A1318;
      --accent-mid:   #401820;
      --accent-ink:   #E8637A;
      --on-accent:    #1A0A0E;

      --bg:        #0D0F14;
      --surface:   #14171E;
      --surface-2: #1C1F28;
      --surface-3: #181B23;
      --border:    #252933;
      --border-2:  #353A4A;

      --ink:   #E6E9F0;
      --ink-2: #A8AEBA;
      --ink-3: #70778A;
      --ink-4: #4E5468;

      --ok:       #3DC48A;
      --ok-soft:  #0D2419;
      --info:     #7AAAE0;
      --info-soft:#101D30;
      --warn:     #D4A054;
      --warn-soft:#231800;
      --violet:   #A898D8;
      --violet-soft:#1A1628;
      --teal:     #5CC0BC;
      --teal-soft:#0E2221;

      --shadow-xs: 0 1px 2px rgba(0,0,0,.4);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px -6px rgba(0,0,0,.7);
      --shadow-md: 0 2px 8px rgba(0,0,0,.5), 0 12px 32px -10px rgba(0,0,0,.8);
      --shadow-lg: 0 8px 40px -12px rgba(0,0,0,.85);
    }
  }
  :root[data-theme="dark"] {
    --accent:       #E8637A;
    --accent-hover: #F08090;
    --accent-soft:  #2A1318;
    --accent-mid:   #401820;
    --accent-ink:   #E8637A;
    --on-accent:    #1A0A0E;
    --bg:        #0D0F14;
    --surface:   #14171E;
    --surface-2: #1C1F28;
    --surface-3: #181B23;
    --border:    #252933;
    --border-2:  #353A4A;
    --ink:   #E6E9F0;
    --ink-2: #A8AEBA;
    --ink-3: #70778A;
    --ink-4: #4E5468;
    --ok:       #3DC48A;
    --ok-soft:  #0D2419;
    --info:     #7AAAE0;
    --info-soft:#101D30;
    --warn:     #D4A054;
    --warn-soft:#231800;
    --violet:   #A898D8;
    --violet-soft:#1A1628;
    --teal:     #5CC0BC;
    --teal-soft:#0E2221;
    --shadow-xs: 0 1px 2px rgba(0,0,0,.4);
    --shadow-sm: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px -6px rgba(0,0,0,.7);
    --shadow-md: 0 2px 8px rgba(0,0,0,.5), 0 12px 32px -10px rgba(0,0,0,.8);
    --shadow-lg: 0 8px 40px -12px rgba(0,0,0,.85);
  }

  /* ======================= BASE ======================= */
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent-ink); text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ======================== SHELL ======================== */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }

  /* ====================== SIDEBAR ======================= */
  .side {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
  }

  /* Marca / logo */
  .brand {
    padding: 1.25rem 1.1rem 1.1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: .75rem;
    align-items: center;
    flex-shrink: 0;
  }
  .crest {
    width: 36px;
    height: 36px;
    border-radius: var(--r-sm);
    background: var(--accent);
    color: var(--on-accent);
    display: grid;
    place-items: center;
    font-family: var(--serif);
    font-weight: 700;
    font-size: .95rem;
    flex: none;
    letter-spacing: -.02em;
  }
  .brand-t {
    font-family: var(--serif);
    font-weight: 700;
    font-size: .98rem;
    line-height: 1.2;
    letter-spacing: -.01em;
    color: var(--ink);
  }
  .brand-s {
    font-family: var(--mono);
    font-size: .58rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-top: .18rem;
  }

  /* Búsqueda */
  .side-search { padding: .8rem .85rem .5rem; flex-shrink: 0; }
  .side-search input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid transparent;
    border-radius: var(--r-md);
    padding: .45rem .7rem;
    font-size: .84rem;
    transition: border-color var(--t-base), background var(--t-base);
  }
  .side-search input::placeholder { color: var(--ink-4); }
  .side-search input:focus { background: var(--surface); border-color: var(--border-2); }

  /* Etiqueta de sección */
  .side-lbl {
    font-family: var(--mono);
    font-size: .58rem;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-4);
    padding: .5rem 1rem .3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .side-lbl span:last-child {
    background: var(--surface-2);
    color: var(--ink-3);
    border-radius: var(--r-pill);
    padding: .06rem .45rem;
    font-size: .6rem;
  }

  /* Lista de navegación */
  .side-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 .6rem .8rem;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .side-list::-webkit-scrollbar { width: 4px; }
  .side-list::-webkit-scrollbar-track { background: transparent; }
  .side-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Nav item de curso */
  .cnav {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--r-md);
    padding: .65rem .75rem;
    cursor: pointer;
    display: block;
    margin-bottom: .2rem;
    transition: background var(--t-fast);
    position: relative;
  }
  .cnav::before {
    content: '';
    position: absolute;
    left: 0; top: 15%; bottom: 15%;
    width: 3px;
    border-radius: 0 2px 2px 0;
    background: var(--accent);
    opacity: 0;
    transition: opacity var(--t-base);
  }
  .cnav:hover { background: var(--surface-2); }
  .cnav.on { background: var(--accent-soft); }
  .cnav.on::before { opacity: 1; }
  .cnav-code {
    font-family: var(--mono);
    font-size: .58rem;
    letter-spacing: .09em;
    color: var(--ink-4);
    text-transform: uppercase;
    margin-bottom: .18rem;
  }
  .cnav.on .cnav-code { color: var(--accent-ink); }
  .cnav-t {
    font-size: .86rem;
    font-weight: 600;
    line-height: 1.35;
    margin: 0 0 .4rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--ink-2);
  }
  .cnav.on .cnav-t { color: var(--ink); }
  .cnav-bar {
    height: 2px;
    background: var(--border);
    border-radius: var(--r-pill);
    overflow: hidden;
  }
  .cnav-bar i {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: var(--r-pill);
    transition: width var(--t-slow);
  }
  .cnav-meta {
    font-family: var(--mono);
    font-size: .58rem;
    color: var(--ink-4);
    margin-top: .25rem;
    font-variant-numeric: tabular-nums;
  }

  /* Footer sidebar */
  .side-foot {
    border-top: 1px solid var(--border);
    padding: .8rem .85rem;
    display: grid;
    gap: .5rem;
    flex-shrink: 0;
  }
  .side-note {
    font-family: var(--mono);
    font-size: .58rem;
    line-height: 1.65;
    color: var(--ink-4);
    display: flex;
    align-items: center;
    gap: .4rem;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-4);
    flex: none;
  }
  .dot.live { background: var(--ok); }

  /* ====================== BOTONES ====================== */
  .btn {
    border: 1px solid var(--border-2);
    background: var(--surface);
    color: var(--ink-2);
    border-radius: var(--r-pill);
    padding: .4rem .85rem;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    white-space: nowrap;
    transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
    letter-spacing: .005em;
  }
  .btn:hover { border-color: var(--ink-3); color: var(--ink); background: var(--surface-2); }

  /* Primary */
  .btn-p {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
    letter-spacing: .02em;
  }
  .btn-p:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }

  /* Ghost / destructivo */
  .btn-d {
    color: var(--accent-ink);
    border-color: transparent;
    background: none;
  }
  .btn-d:hover { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }

  /* Utilitarios */
  .btn-w { width: 100%; justify-content: center; }
  .btn-s { padding: .28rem .65rem; font-size: .78rem; }

  /* Botón de aula */
  .btn-aula { border-color: var(--accent-mid); color: var(--accent-ink); }
  .btn-aula:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }

  /* ====================== TOPBAR ====================== */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .6rem 1.75rem;
    display: flex;
    align-items: center;
    gap: .75rem;
    position: sticky;
    top: 0;
    z-index: 12;
    min-height: 52px;
  }

  .crumb {
    font-family: var(--mono);
    font-size: .66rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--ink-4);
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: .4rem;
  }
  .crumb b { color: var(--ink-2); font-weight: 600; font-family: var(--sans); font-size: .74rem; text-transform: none; letter-spacing: 0; }
  .crumb-s { color: var(--border-2); }
  .lnk {
    background: none; border: none; color: var(--accent-ink);
    font: inherit; cursor: pointer; padding: 0;
    font-size: .82rem; font-weight: 600;
  }
  .lnk:hover { text-decoration: underline; }
  .r-aula { color: var(--accent-ink); font-weight: 700; }

  /* ======================== HERO ======================== */
  .hero {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 2rem 1.75rem 0;
  }
  .hero-in { max-width: 72rem; }

  .chiprow { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin-bottom: .7rem; }
  .chip {
    font-family: var(--mono);
    font-size: .58rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    padding: .2rem .5rem;
    border-radius: var(--r-xs);
    background: var(--surface-2);
    color: var(--ink-3);
    border: 1px solid var(--border);
  }
  .chip.brand {
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-color: var(--accent-mid);
    font-weight: 700;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 2rem;
    line-height: 1.15;
    letter-spacing: -.02em;
    margin: 0 0 .55rem;
    text-wrap: balance;
    color: var(--ink);
  }
  .hero-sub {
    color: var(--ink-3);
    max-width: 52rem;
    margin: 0 0 1.2rem;
    font-size: .95rem;
    line-height: 1.65;
  }

  /* Estadísticas del hero */
  .stats {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    margin-bottom: 1.3rem;
    padding-bottom: .1rem;
  }
  .stat dt {
    font-family: var(--mono);
    font-size: .58rem;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--ink-4);
    margin-bottom: .18rem;
  }
  .stat dd {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .stat dd small {
    font-family: var(--sans);
    font-size: .76rem;
    font-weight: 400;
    color: var(--ink-3);
    margin-left: .15rem;
  }

  /* Barra de progreso */
  .pbar {
    height: 3px;
    background: var(--border);
    border-radius: var(--r-pill);
    overflow: hidden;
    max-width: 30rem;
  }
  .pbar i {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: var(--r-pill);
    transition: width var(--t-slow);
  }
  .pline {
    font-family: var(--mono);
    font-size: .65rem;
    color: var(--ink-4);
    margin-top: .45rem;
    font-variant-numeric: tabular-nums;
    margin-bottom: 1.2rem;
  }

  /* ======================== TABS ======================== */
  .tabs {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--border);
    margin-top: .2rem;
  }
  .tab {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    padding: .65rem 1rem;
    font-size: .85rem;
    font-weight: 600;
    color: var(--ink-3);
    cursor: pointer;
    transition: color var(--t-base), border-color var(--t-base);
    letter-spacing: .005em;
    position: relative;
    top: 1px;
  }
  .tab:hover { color: var(--ink-2); }
  .tab.on { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .tab .n {
    font-family: var(--mono);
    font-size: .6rem;
    color: var(--ink-4);
    margin-left: .35rem;
    background: var(--surface-2);
    padding: .08rem .35rem;
    border-radius: var(--r-pill);
    border: 1px solid var(--border);
  }
  .tab.on .n { background: var(--accent-soft); border-color: var(--accent-mid); color: var(--accent-ink); }

  /* ======================== BODY ======================== */
  .body { padding: 1.75rem; }
  .body-in { max-width: 72rem; }
  .body-in.wide { max-width: 82rem; }

  /* ====================== MÓDULOS ====================== */
  .mod {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    margin-bottom: .75rem;
    box-shadow: var(--shadow-xs);
    overflow: hidden;
    transition: box-shadow var(--t-base), border-color var(--t-base);
  }
  .mod:hover { box-shadow: var(--shadow-sm); }
  .mod.open { border-color: var(--border-2); box-shadow: var(--shadow-sm); }

  .mod-h {
    display: grid;
    grid-template-columns: 2.8rem 1fr auto;
    gap: 1rem;
    align-items: center;
    padding: 1rem 1.1rem;
    cursor: pointer;
    width: 100%;
    background: none;
    border: none;
    text-align: left;
    transition: background var(--t-fast);
  }
  .mod-h:hover { background: var(--surface-3); }

  .mod-n {
    font-family: var(--serif);
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent-ink);
    text-align: center;
    line-height: 1;
    opacity: .85;
  }
  .mod-t {
    font-weight: 700;
    font-size: .95rem;
    line-height: 1.35;
    color: var(--ink);
  }
  .mod-m {
    font-family: var(--mono);
    font-size: .62rem;
    color: var(--ink-4);
    margin-top: .22rem;
    font-variant-numeric: tabular-nums;
  }
  .mod-r { display: flex; align-items: center; gap: .75rem; }

  /* Ring SVG de progreso */
  .ring { width: 32px; height: 32px; flex: none; }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .bg { stroke: var(--border); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dasharray var(--t-slow); }
  .ring text { font-family: var(--mono); font-size: 8.5px; fill: var(--ink-3); text-anchor: middle; font-variant-numeric: tabular-nums; }

  .caret {
    color: var(--ink-4);
    transition: transform var(--t-base);
    font-size: .65rem;
  }
  .mod.open .caret { transform: rotate(90deg); }

  .mod-b {
    display: none;
    padding: 0 1.1rem 1.25rem;
    border-top: 1px solid var(--border);
  }
  .mod.open .mod-b { display: block; }

  .obj {
    color: var(--ink-3);
    font-size: .92rem;
    margin: 1rem 0 0;
    max-width: 52rem;
    line-height: 1.7;
  }

  /* Label de sección con línea */
  .lbl {
    font-family: var(--mono);
    font-size: .6rem;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-4);
    margin: 1.5rem 0 .6rem;
    display: flex;
    align-items: center;
    gap: .7rem;
  }
  .lbl::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* =================== RECURSOS =================== */
  .res {
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
    box-shadow: var(--shadow-xs);
  }
  .r {
    display: grid;
    grid-template-columns: 1.6rem 5rem 1fr auto;
    gap: .7rem;
    align-items: start;
    padding: .65rem .8rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    transition: background var(--t-fast);
  }
  .r:last-child { border-bottom: none; }
  .r:hover { background: var(--surface-3); }
  .r input[type=checkbox] {
    margin: .28rem 0 0;
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* Badges de tipo */
  .ty {
    font-family: var(--mono);
    font-size: .56rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: .18rem .4rem;
    border-radius: var(--r-pill);
    text-align: center;
    margin-top: .16rem;
    font-weight: 600;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .ty-video   { background: var(--accent-soft);  color: var(--accent-ink);  border-color: var(--accent-mid); }
  .ty-curso   { background: var(--info-soft);    color: var(--info);       border-color: rgba(29,76,143,.15); }
  .ty-libro   { background: var(--surface-2);    color: var(--ink-3);      border-color: var(--border); }
  .ty-lectura { background: var(--violet-soft);  color: var(--violet);     border-color: rgba(74,58,122,.15); }
  .ty-docs    { background: var(--teal-soft);    color: var(--teal);       border-color: rgba(19,96,96,.15); }
  .ty-norma   { background: var(--warn-soft);    color: var(--warn);       border-color: rgba(138,83,0,.15); }
  .ty-dataset { background: var(--ok-soft);      color: var(--ok);         border-color: rgba(26,107,74,.15); }
  .ty-tool    { background: var(--surface-2);    color: var(--ink-3);      border-color: var(--border); }
  .ty-cert    { background: var(--warn-soft);    color: var(--warn);       border-color: var(--warn); }

  .r-n { font-size: .88rem; font-weight: 600; line-height: 1.4; }
  .r-n a { text-decoration: none; color: var(--ink); }
  .r-n a:hover { color: var(--accent-ink); text-decoration: underline; }
  .r-n a::after { content: "↗"; font-size: .68em; margin-left: .22rem; color: var(--ink-4); vertical-align: .15em; }
  .r-s { font-size: .79rem; color: var(--ink-4); margin-top: .08rem; }
  .r-s em { font-style: normal; color: var(--ink-3); }
  .r-x { display: flex; gap: .3rem; align-items: center; padding-top: .1rem; }
  .r.done .r-n { color: var(--ink-4); }
  .r.done .r-n a { color: var(--ink-4); text-decoration: line-through; }
  .r-mod { font-family: var(--mono); font-size: .62rem; color: var(--ink-4); padding-top: .2rem; }

  /* Ficha de lectura / resumen */
  .sum {
    grid-column: 3 / -1;
    margin-top: .6rem;
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    padding: .7rem .85rem;
    font-size: .84rem;
    color: var(--ink-2);
    display: none;
  }
  .r.sum-open .sum { display: block; }
  .sum b {
    font-family: var(--mono);
    font-size: .58rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--accent-ink);
    display: block;
    margin-bottom: .3rem;
  }
  .sum .fk-k { font-family: var(--mono); font-size: .58rem; letter-spacing: .09em; text-transform: uppercase; color: var(--accent-ink); margin: .8rem 0 .18rem; }
  .sum p { margin: 0; line-height: 1.65; }
  .sum .fk-lang { font-size: .79rem; color: var(--ink-4); font-style: italic; margin-bottom: .25rem; }
  .sum ul { margin: .25rem 0 0; padding-left: 1.1rem; }
  .sum li { margin-bottom: .28rem; }
  .sum .fk-free { margin-top: .8rem; font-size: .79rem; word-break: break-all; }

  /* ================== CAJAS EVALUACIÓN ================== */
  .box {
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: .8rem 1rem;
    font-size: .9rem;
    color: var(--ink-2);
    line-height: 1.65;
  }
  .box + .box { margin-top: .5rem; }
  .box .k {
    font-family: var(--mono);
    font-size: .58rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-4);
    display: block;
    margin-bottom: .25rem;
  }
  .box.deliv { border-left: 3px solid var(--info); }
  .box.deliv .k { color: var(--info); }
  .box.mast  { border-left: 3px solid var(--ok); }
  .box.mast  .k { color: var(--ok); }
  .box.prac  { border-left: 3px solid var(--accent); }
  .box.prac  .k { color: var(--accent-ink); }

  /* ================ IDIOMA / BADGES LIBRE ================ */
  .lang {
    font-family: var(--mono);
    font-size: .54rem;
    font-weight: 600;
    letter-spacing: .06em;
    padding: .07rem .32rem;
    border-radius: var(--r-xs);
    margin-left: .4rem;
    vertical-align: .1em;
    text-decoration: none;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .lang.ok   { background: var(--ok-soft);    color: var(--ok);   border-color: rgba(26,107,74,.18); }
  .lang.no   { background: var(--surface-2);  color: var(--ink-3); border-color: var(--border); }
  .lang.qq   { background: var(--warn-soft);  color: var(--warn); border-color: rgba(138,83,0,.18); }
  .lang.free { background: var(--info-soft);  color: var(--info); border-color: rgba(29,76,143,.18); }
  .lang.free:hover { text-decoration: underline; }

  /* ================ BIBLIOTECA ================ */
  .filters {
    display: flex;
    gap: .35rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
    align-items: center;
  }
  .fbtn {
    font-family: var(--mono);
    font-size: .64rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: .3rem .65rem;
    border-radius: var(--r-pill);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-3);
    cursor: pointer;
    font-weight: 600;
    transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
  }
  .fbtn:hover { border-color: var(--border-2); color: var(--ink-2); background: var(--surface-2); }
  .fbtn.on {
    background: var(--ink);
    color: var(--surface);
    border-color: var(--ink);
  }
  .lib {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
    box-shadow: var(--shadow-xs);
  }
  .lib .r { grid-template-columns: 1.6rem 5rem 1fr 7.5rem auto; }

  /* ================ ENTREGABLES ================ */
  .dv {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 1rem 1.15rem;
    margin-bottom: .7rem;
    box-shadow: var(--shadow-xs);
    display: grid;
    grid-template-columns: 2.6rem 1fr;
    gap: 1rem;
    transition: box-shadow var(--t-base);
  }
  .dv:hover { box-shadow: var(--shadow-sm); }
  .dv-n {
    font-family: var(--serif);
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent-ink);
    opacity: .85;
  }
  .dv h4 { margin: 0 0 .4rem; font-size: .93rem; font-weight: 700; color: var(--ink); }
  .dv h4 .st {
    font-family: var(--mono);
    font-size: .6rem;
    letter-spacing: .06em;
    padding: .12rem .4rem;
    border-radius: var(--r-pill);
    margin-left: .5rem;
    vertical-align: .15em;
    font-weight: 600;
    border: 1px solid transparent;
  }
  .st-none { background: var(--surface-2); color: var(--ink-4); border-color: var(--border); }
  .st-sub  { background: var(--info-soft); color: var(--info); border-color: rgba(29,76,143,.18); }
  .st.g-hi { background: var(--ok-soft);   color: var(--ok);   border-color: rgba(26,107,74,.18); }
  .st.g-ok { background: var(--warn-soft); color: var(--warn); border-color: rgba(138,83,0,.18); }
  .st.g-lo { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-mid); }

  /* ================ SUBIDA / PANEL DE ENTREGA ================ */
  .sub-p { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .sub-row { display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; }
  .file-btn {
    border: 1px dashed var(--border-2);
    border-radius: var(--r-md);
    padding: .45rem .8rem;
    font-size: .84rem;
    cursor: pointer;
    background: var(--surface-3);
    color: var(--ink-2);
    transition: border-color var(--t-base), color var(--t-base);
  }
  .file-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
  .file-btn input { display: none; }
  .sub-st { font-family: var(--mono); font-size: .7rem; color: var(--ink-4); }

  .grading {
    margin-top: 1rem;
    padding: .85rem 1rem;
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    font-size: .88rem;
    color: var(--ink-2);
    display: flex;
    align-items: center;
    gap: .65rem;
  }
  .grading.err { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .spin {
    width: 14px; height: 14px;
    border: 2px solid var(--border-2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: sp .7s linear infinite;
    flex: none;
  }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ================ CALIFICACIONES ================ */
  .grade {
    margin-top: 1.1rem;
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
    box-shadow: var(--shadow-xs);
  }
  .grade-h {
    display: flex;
    gap: 1.2rem;
    align-items: center;
    padding: 1rem 1.15rem;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .grade-n {
    font-family: var(--serif);
    font-size: 2.8rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .grade-n small { font-family: var(--sans); font-size: .76rem; font-weight: 400; color: var(--ink-4); margin-left: .25rem; }
  .grade-n.g-hi, .grade-v.g-hi { color: var(--ok); }
  .grade-n.g-ok, .grade-v.g-ok { color: var(--warn); }
  .grade-n.g-lo, .grade-v.g-lo { color: var(--accent-ink); }
  .grade-v { font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
  .grade-s { font-family: var(--mono); font-size: .65rem; color: var(--ink-4); margin-top: .2rem; }
  .grade-r { margin: 0; padding: .9rem 1.15rem; font-size: .92rem; border-bottom: 1px solid var(--border); color: var(--ink-2); line-height: 1.65; }

  .cris { padding: .9rem 1.15rem; display: grid; gap: .85rem; border-bottom: 1px solid var(--border); }
  .cri-h { display: flex; justify-content: space-between; gap: .7rem; font-size: .87rem; font-weight: 700; }
  .cri-p { font-family: var(--mono); font-size: .68rem; font-weight: 400; color: var(--ink-4); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cri-bar { height: 4px; background: var(--border); border-radius: var(--r-pill); overflow: hidden; margin: .3rem 0; }
  .cri-bar i { display: block; height: 100%; background: var(--accent); border-radius: var(--r-pill); }
  .cri-c { font-size: .84rem; color: var(--ink-3); line-height: 1.6; }

  .fb { padding: .8rem 1.15rem; border-bottom: 1px solid var(--border); }
  .fb:last-child { border-bottom: none; }
  .fb .k { font-family: var(--mono); font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: .35rem; font-weight: 700; }
  .fb ul { margin: 0; padding-left: 1.1rem; font-size: .87rem; }
  .fb li { margin-bottom: .3rem; line-height: 1.6; }
  .fb-ok .k { color: var(--ok); }
  .fb-no .k { color: var(--accent-ink); }
  .fb-do .k { color: var(--info); }

  /* ================== RÚBRICA ================== */
  .rub { display: grid; gap: .4rem; margin: .4rem 0 1rem; }
  .rub-r {
    display: grid;
    grid-template-columns: 3.2rem 1fr;
    gap: .75rem;
    align-items: baseline;
    padding: .4rem 0;
    border-bottom: 1px solid var(--border);
  }
  .rub-r:last-child { border-bottom: none; }
  .rub-w {
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--accent-ink);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  .rub-r b { font-size: .87rem; font-weight: 700; display: block; color: var(--ink); }
  .rub-r span { font-size: .83rem; color: var(--ink-3); line-height: 1.6; }

  .disc {
    font-size: .82rem;
    color: var(--ink-3);
    background: var(--surface-3);
    border-left: 3px solid var(--border-2);
    padding: .55rem .8rem;
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    margin: 0;
    line-height: 1.65;
  }
  .disc.warn { border-left-color: var(--warn); color: var(--warn); margin-top: .5rem; }

  /* ================= CONFIGURACIÓN / FORMULARIOS ================= */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 1.25rem 1.35rem;
    box-shadow: var(--shadow-xs);
    margin-bottom: .9rem;
  }
  .card h3 {
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0 0 .25rem;
    color: var(--ink);
  }
  .card p.hint { color: var(--ink-3); font-size: .87rem; margin: 0 0 1rem; max-width: 44rem; line-height: 1.65; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .8rem; }
  .fld { display: flex; flex-direction: column; gap: .25rem; }
  .fld label {
    font-family: var(--mono);
    font-size: .6rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-4);
    font-weight: 600;
  }
  .fld input, .fld select, .fld textarea {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: .42rem .65rem;
    font-size: .87rem;
    width: 100%;
    transition: border-color var(--t-base), background var(--t-base);
    color: var(--ink);
  }
  .fld input:focus, .fld select:focus, .fld textarea:focus {
    background: var(--surface);
    border-color: var(--accent);
    outline: none;
    box-shadow: 0 0 0 3px rgba(196,18,48,.1);
  }
  .fld textarea { resize: vertical; min-height: 5rem; font-family: var(--sans); line-height: 1.6; }
  .fld.wide { grid-column: 1 / -1; }
  .actions { display: flex; gap: .5rem; margin-top: 1.1rem; flex-wrap: wrap; }

  /* ================= AULA VIRTUAL ================= */
  .aula {
    display: grid;
    grid-template-columns: 22rem 1fr;
    gap: 1.75rem;
    align-items: start;
  }
  .aula-side {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
    position: sticky;
    top: 1rem;
    max-height: calc(100vh - 2rem);
    overflow-y: auto;
    box-shadow: var(--shadow-xs);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .aula-side::-webkit-scrollbar { width: 4px; }
  .aula-side::-webkit-scrollbar-track { background: transparent; }
  .aula-side::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .aula-side-h {
    padding: 1rem 1.1rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .aula-n {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1rem;
    line-height: 1.3;
    color: var(--ink);
  }
  .aula-p { display: flex; align-items: center; gap: .65rem; margin-top: .55rem; }
  .aula-bar { flex: 1; height: 3px; background: var(--border); border-radius: var(--r-pill); overflow: hidden; }
  .aula-bar i { display: block; height: 100%; background: var(--accent); border-radius: var(--r-pill); transition: width var(--t-slow); }
  .aula-p span { font-family: var(--mono); font-size: .64rem; color: var(--ink-4); white-space: nowrap; }

  /* Unidades del aula */
  .u { border-bottom: 1px solid var(--border); }
  .u:last-child { border-bottom: none; }
  .u-h {
    width: 100%;
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .85rem 1.1rem;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
    color: inherit;
    font: inherit;
    transition: background var(--t-fast);
  }
  .u-h:hover { background: var(--surface-3); }
  .u.open > .u-h { background: var(--info-soft); }
  .u-t { font-weight: 700; font-size: .9rem; line-height: 1.3; color: var(--ink); }
  .u-s { font-size: .74rem; color: var(--ink-4); margin-top: .18rem; }
  .u-chev {
    margin-left: auto;
    width: 8px; height: 8px;
    border-right: 2px solid var(--ink-4);
    border-bottom: 2px solid var(--ink-4);
    transform: rotate(45deg);
    transition: transform var(--t-base);
    flex: none;
  }
  .u.open .u-chev { transform: rotate(-135deg); }
  .u.soon .u-t { color: var(--ink-3); }
  .u-b { display: none; padding: .25rem 0 .5rem; }
  .u.open .u-b { display: block; }

  /* Lecciones dentro de la unidad */
  .u-l {
    width: 100%;
    display: flex;
    align-items: center;
    gap: .65rem;
    padding: .5rem 1.1rem .5rem 1.25rem;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    text-align: left;
    cursor: pointer;
    color: var(--ink-3);
    font: inherit;
    transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
  }
  .u-l:hover { background: var(--surface-3); color: var(--ink-2); }
  .u-l.on {
    border-left-color: var(--accent);
    background: var(--accent-soft);
    color: var(--ink);
    font-weight: 700;
  }
  .u-l-tick {
    width: 14px; height: 14px;
    border: 1.5px solid var(--border-2);
    border-radius: 50%;
    flex: none;
    transition: background var(--t-base), border-color var(--t-base);
  }
  .u-l.done .u-l-tick { background: var(--ok); border-color: var(--ok); }
  .u-l-t { font-size: .84rem; line-height: 1.4; }
  .u-l-m { margin-left: auto; font-family: var(--mono); font-size: .62rem; color: var(--ink-4); white-space: nowrap; }
  .u-l-exam .u-l-t { font-style: italic; }

  /* ================ LECCIÓN / CONTENIDO EDITORIAL ================ */
  .aula-main { min-width: 0; }

  .aula-title {
    font-family: var(--serif);
    font-size: 1.55rem;
    font-weight: 700;
    margin: 0 0 .6rem;
    line-height: 1.2;
    color: var(--ink);
  }
  .aula-lead { color: var(--ink-3); font-size: .93rem; margin: 0 0 1rem; line-height: 1.65; }
  .aula-att {
    font-size: .79rem;
    color: var(--ink-4);
    border-left: 3px solid var(--border-2);
    padding: .45rem .75rem;
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    background: var(--surface-3);
    line-height: 1.55;
  }
  .aula-att .k { font-family: var(--mono); font-size: .56rem; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: .18rem; color: var(--ink-4); }
  .aula-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(6rem, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    margin: 1.1rem 0;
    box-shadow: var(--shadow-xs);
  }
  .aula-stats > div { background: var(--surface); padding: .8rem .95rem; }
  .aula-stats b { display: block; font-family: var(--serif); font-size: 1.5rem; font-weight: 700; line-height: 1; color: var(--ink); }
  .aula-stats span { font-family: var(--mono); font-size: .6rem; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-4); }
  .soon-card p { color: var(--ink-3); font-size: .92rem; line-height: 1.65; }

  .les {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 1.75rem 2rem 1.5rem;
    box-shadow: var(--shadow-sm);
  }
  .les-h {
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
    margin-bottom: 1.35rem;
  }
  .les-u {
    font-family: var(--mono);
    font-size: .64rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent-ink);
    margin-bottom: .35rem;
    font-weight: 600;
  }
  .les-h h2 {
    font-family: var(--serif);
    font-size: 1.7rem;
    font-weight: 700;
    margin: 0 0 .4rem;
    line-height: 1.2;
    text-wrap: balance;
    color: var(--ink);
  }
  .les-m { font-family: var(--mono); font-size: .66rem; color: var(--ink-4); }

  .les-b p {
    font-size: .97rem;
    line-height: 1.78;
    margin: 0 0 1.1rem;
    max-width: 44rem;
    color: var(--ink-2);
  }

  .les-box {

              title: "El flujo de un proyecto de machine learning", mins: 18,
              body: [
                "Un proyecto de aprendizaje automático recorre siempre las mismas tres etapas: recoger datos, entrenar un modelo y desplegarlo. Dicho así parece lineal, y ahí empieza el malentendido. En la práctica es un ciclo que se recorre varias veces, y cada vuelta suele obligar a rehacer la etapa anterior. Entrenas, descubres que el modelo confunde dos categorías, y vuelves a recoger datos de esas dos categorías. Despliegas, observas que en producción llegan casos que no estaban en el conjunto de entrenamiento, y vuelves a entrenar.",
                "La primera etapa, recoger datos, es donde se decide casi todo y donde menos tiempo se planifica. Hay que definir qué se recoge, con qué frecuencia, quién lo etiqueta y bajo qué criterio. La trampa habitual es intentar recogerlo todo antes de empezar. Es mejor recoger un conjunto pequeño, entrenar un modelo malo a propósito y ver qué falla: ese modelo deliberadamente insuficiente te dirá en dos semanas qué datos hacen falta de verdad, algo que ninguna reunión de planificación puede anticipar.",
                "La segunda etapa, entrenar, consiste en iterar: probar, medir, ajustar. Lo importante aquí es que la medición sea honesta, y eso exige separar los datos antes de tocar nada. Un conjunto para entrenar, otro para ajustar decisiones y un tercero, intocable, para la evaluación final. Si miras el tercero mientras desarrollas, dejas de tener una estimación imparcial y empiezas a engañarte con precisión creciente. Esta disciplina es aburrida y es la diferencia entre un resultado real y uno inventado.",
                "La tercera etapa, desplegar, es donde mueren la mayoría de los proyectos que llegaron bien hasta aquí. Un modelo en producción necesita recibir datos en el formato correcto, responder en un tiempo aceptable, registrar lo que decide y avisar cuando su rendimiento cae. Nada de eso lo hace el modelo: lo hace la ingeniería alrededor. La proporción habitual es que el modelo sea menos del diez por ciento del código del sistema final.",
                "Hay una consecuencia organizativa que conviene aceptar desde el principio: un proyecto de aprendizaje automático no se puede presupuestar como una obra con entrega final. Se parece más a un contrato de mantenimiento. El día del despliegue no termina el proyecto, empieza la parte larga. Si la aprobación presupuestaria no contempla el año siguiente al despliegue, el modelo se degradará en silencio hasta que alguien lo apague sin saber muy bien por qué dejó de servir.",
                "Por eso conviene fijar desde la primera reunión tres cifras: cuánto tiene que acertar el modelo para que valga la pena usarlo, cuánto tiempo puede tardar en responder y cuánto cuesta al mes tenerlo funcionando. Si el equipo no puede responderlas, todavía está en fase de exploración, y llamarlo proyecto solo sirve para comprometer una fecha que no se va a cumplir."

            {
              title: "El flujo de un proyecto de ciencia de datos", mins: 15,
              body: [
                "Un proyecto de ciencia de datos tiene otro ritmo y otro entregable. Las etapas son recoger datos, analizarlos y proponer acciones. No hay despliegue, no hay sistema que mantener: hay un conjunto de recomendaciones que alguien debe decidir si aplica. Por eso se puede hacer en semanas y por eso, cuando la pregunta es buena, suele tener mejor retorno inmediato que un proyecto de modelado.",
                "La etapa de análisis es la más iterativa de todas y la que peor se lleva con la planificación tradicional. Se formula una hipótesis, se mira el dato, la hipótesis se cae, y aparecen dos preguntas nuevas. Un buen analista cambia de dirección varias veces por semana. Intentar fijar de antemano qué análisis se harán y en qué orden es una forma segura de obtener un informe que responde preguntas que ya no importan.",
                "El entregable es un conjunto de acciones, no un conjunto de gráficos. Es la diferencia entre «las devoluciones subieron un 18 % en la región norte» y «las devoluciones subieron un 18 % en la región norte, concentradas en dos referencias que cambiaron de proveedor en marzo; conviene auditar ese lote antes de la próxima compra». Lo primero es un hallazgo; lo segundo es algo que alguien puede aprobar el martes. Un informe que no llega a la segunda forma rara vez cambia nada.",
                "Hay una tentación recurrente que conviene nombrar: convertir todo proyecto de ciencia de datos en un proyecto de modelado porque suena más ambicioso. A veces la respuesta correcta a «¿por qué caen las ventas?» es una tabla dinámica bien hecha y tres entrevistas, entregadas en cinco días. Proponer un modelo predictivo en su lugar añade tres meses y no responde la pregunta, porque predecir la caída no explica su causa.",
                "Por último, este tipo de proyecto vive o muere por el acceso. Un analista que necesita pedir cada extracción a otra área y esperar cuatro días no puede iterar, y sin iteración no hay análisis, hay un informe único con las preguntas equivocadas. Conceder acceso de lectura amplio a datos de trabajo, con las salvaguardas de privacidad que correspondan, suele aportar más valor que cualquier herramienta que se compre.",
                "Conviene además fijar de antemano cuándo se detiene el análisis. Sin un límite acordado siempre hay una pregunta más que responder y el informe nunca llega. Una regla que funciona es reservar un plazo corto —dos o tres semanas— y comprometer una entrega al final, aunque las conclusiones sean parciales. Un análisis incompleto entregado a tiempo cambia decisiones; uno exhaustivo entregado tarde llega cuando la decisión ya se tomó por otros medios."

                { q: "Un informe concluye que «las devoluciones subieron un 18 % en la región norte». ¿Qué le falta?", opts: ["Nada, es un hallazgo válido", "Una acción concreta y aprobable derivada del hallazgo", "Más gráficos", "Un modelo predictivo"], a: 1, why: ["Es válido pero no cambia nada por sí solo.", "El valor aparece cuando el hallazgo se convierte en algo que alguien puede decidir.", "Más gráficos no acercan a una decisión.", "Predecir la subida no explica su causa ni indica qué hacer."] },

            {
              title: "Cómo elegir y priorizar un proyecto de IA", mins: 20,
              body: [
                "La elección del primer proyecto determina si habrá un segundo. Y el criterio no es que sea el más valioso, sino que sea el que más rápido demuestre valor con menos riesgo. Un proyecto ambicioso que tarda dieciocho meses agota la paciencia de la organización antes de producir nada; uno modesto que funciona en tres meses compra la credibilidad necesaria para intentar el ambicioso después.",
                "El buen candidato vive en la intersección de dos criterios que rara vez coinciden. El primero es la viabilidad técnica: existen datos, la tarea cae dentro de lo que el aprendizaje automático sabe hacer, y hay una forma clara de medir el acierto. El segundo es el valor de negocio: si funciona, alguien cambiará una decisión, y ese cambio se traduce en dinero, tiempo o riesgo evitado. Los proyectos que solo cumplen el primero producen demostraciones que nadie usa; los que solo cumplen el segundo producen frustración.",
                "Para evaluar la viabilidad conviene involucrar a alguien técnico desde la primera conversación, no después de aprobar el presupuesto. Muchas ideas se descartan en veinte minutos con dos preguntas: ¿dónde están los ejemplos etiquetados? y ¿cuántos casos hay al año? Para evaluar el valor hay que hablar con quien toma hoy esa decisión y preguntarle qué haría distinto si tuviera la predicción. Si responde que nada cambiaría, el proyecto es inútil por muy bien que salga el modelo.",
                "Una regla de escala que ahorra disgustos: el primer proyecto debe poder ejecutarse con el personal disponible y en un plazo de entre seis y doce meses, idealmente menos. Debe además ser específico y acotado: no «optimizar la logística», sino «predecir la rotación semanal de las cincuenta referencias de mayor volumen en una bodega». Un alcance estrecho no es falta de ambición, es la condición para terminar.",

                "Un último filtro, sencillo y muy eficaz: pregunta quién va a usar el resultado día a día y comprueba que esa persona esté enterada y de acuerdo. Muchos proyectos se aprueban entre dirección y equipo técnico sin hablar con quien tendrá el sistema delante ocho horas al día. Si esa persona no ve el beneficio, encontrará la manera de no usarlo, y ningún indicador de precisión compensa un sistema que la gente esquiva."

            {

              body: [
                "La conversación entre quien conoce el negocio y quien construye el modelo falla casi siempre en el mismo punto: la ambigüedad del objetivo. El equipo técnico necesita una especificación que se pueda comprobar, y eso significa cuatro cosas explícitas: qué entra, qué sale, con qué métrica se mide el acierto y cuál es el mínimo aceptable. Sin las cuatro, el equipo elegirá por su cuenta y elegirá según lo que sea fácil de optimizar, no según lo que importe.",
                "La elección de la métrica es donde más se pierde valor por omisión. Decir «que acierte lo máximo posible» parece razonable y es una instrucción vacía, porque acierto puede significar cosas opuestas. Si de cada mil envíos solo diez llegan fuera de temperatura, un modelo que diga siempre «todo bien» acierta el 99 % y no sirve para nada. Hay que decidir explícitamente qué error duele más: no detectar un envío comprometido, o alarmar sobre envíos que estaban bien. Esa decisión es de negocio y nadie del área técnica puede tomarla por ti.",

              quiz: [

            {

                "La proporción que sorprende a quien no ha pasado por esto es cuánto pesa la ingeniería de datos. Es habitual que la primera contratación correcta no sea un científico de datos sino un ingeniero de datos, porque sin datos accesibles y fiables el científico no puede trabajar. Contratar al revés produce un profesional caro y frustrado que dedica su jornada a limpiar archivos de hoja de cálculo.",

                "De ahí se deriva una decisión estructural que muchas organizaciones postergan y luego lamentan: unificar el acceso a los datos. Cuando cada sistema guarda su parte y nadie puede cruzarlos, el valor está fragmentado. No hace falta un almacén único ni un proyecto de tres años; basta con que exista una vía fiable de leer y cruzar lo que ya se tiene. La mayoría de las oportunidades interesantes aparecen precisamente en el cruce entre dos sistemas que hoy no se hablan.",

                "Conviene distinguir tres orígenes, porque tienen remedios distintos. El primero es el sesgo en los datos de entrenamiento, que refleja decisiones pasadas injustas o simplemente una muestra que no representa a toda la población afectada. El segundo es el sesgo por variables sustitutas: aunque elimines la variable sensible, otras la reconstruyen. El código postal predice el nivel socioeconómico; el tipo de contrato predice la edad. Borrar la columna sensible da tranquilidad y no elimina el problema.",
                "El tercero es más sutil y aparece en el uso: el sesgo de retroalimentación. Si el modelo asigna menos recursos a un grupo, ese grupo generará peores resultados, y esos resultados alimentarán la próxima versión del modelo confirmando la decisión inicial. El sistema se da la razón a sí mismo con datos que él mismo produjo. Detectarlo exige mirar cómo evoluciona la distribución de decisiones en el tiempo, no solo la métrica de acierto de la última versión.",
                "Para medirlo hacen falta definiciones explícitas de equidad, y aquí hay una dificultad que conviene conocer: las definiciones razonables son matemáticamente incompatibles entre sí salvo en casos triviales. Puedes exigir que la tasa de acierto sea igual entre grupos, o que la tasa de falsos positivos lo sea, o que la proporción de decisiones favorables sea igual, pero no las tres a la vez. Elegir cuál importa en tu caso es una decisión ética y de negocio que no se delega en el equipo técnico.",
                "En la práctica, el trabajo consiste en cuatro pasos concretos: identificar los grupos protegidos relevantes, medir el rendimiento del modelo por separado en cada uno, decidir qué diferencia es tolerable y documentar la decisión con su justificación. Herramientas como Fairlearn hacen la medición. Lo que ninguna herramienta hace es elegir el criterio ni asumir la responsabilidad, y en un sector regulado esa documentación es lo primero que pedirá un auditor.",
                "Y una nota práctica: la ausencia de datos demográficos no protege de nada. Es común que una organización no registre género o etnia y concluya que su modelo no puede discriminar. Ocurre lo contrario: sin esas variables no puedes medir si discrimina, pero el modelo sigue pudiendo hacerlo a través de sustitutos. Recoger datos sensibles con el único propósito de auditar equidad, con las garantías legales correspondientes, suele ser la opción más responsable."

            {
              title: "Ataques adversarios y seguridad del modelo", mins: 18,
              body: [
                "Un modelo desplegado es un activo atacable, y sus superficies de ataque no coinciden con las del software convencional. La primera y más conocida es la evasión: modificar la entrada de forma casi imperceptible para que el modelo se equivoque. Un cambio de píxeles que un ojo humano no distingue puede convertir una señal de alto en un límite de velocidad para un clasificador de imágenes; unas palabras insertadas en un documento pueden hacer que un filtro lo clasifique como inofensivo.",
                "La segunda es el envenenamiento del entrenamiento. Si un atacante puede influir en los datos con los que el modelo aprende —y puede, si el sistema se reentrena con datos que llegan de fuera— es posible insertar un comportamiento a medida: una puerta trasera que se activa ante una señal concreta y pasa desapercibida en cualquier evaluación general. Este ataque es especialmente relevante en sistemas que aprenden en continuo de la actividad de los usuarios.",
                "La tercera es la extracción, en dos variantes. Extracción de modelo: consultando repetidamente el sistema, un atacante puede reconstruir una copia funcional sin acceder nunca al original, lo que convierte una API pública en una vía de fuga de propiedad intelectual. Y extracción de datos: en ciertos casos es posible recuperar ejemplos concretos del conjunto de entrenamiento, lo que en un contexto con datos de pacientes es un incidente de privacidad grave.",
                "Con modelos de lenguaje aparece una cuarta familia, la inyección de instrucciones. El sistema no distingue de forma fiable entre las instrucciones de su operador y el texto que procesa, de modo que un documento, un correo o una página web pueden contener órdenes que el modelo obedece. Si además ese modelo tiene acceso a herramientas —consultar una base, enviar un mensaje— la inyección deja de ser un problema de contenido y pasa a ser ejecución de acciones no autorizadas.",
                "Las defensas existen pero ninguna es completa, y el enfoque correcto es el mismo que ya aplicas en seguridad: capas y supuestos conservadores. Validar y limitar las entradas, controlar la tasa de consultas para dificultar la extracción, verificar la procedencia de los datos de reentrenamiento, mantener a una persona en el circuito para las decisiones de mayor impacto, y registrar todo lo que el modelo decide para poder investigar después. Ninguna de estas medidas es exótica; lo exótico sería desplegar sin ellas.",
                "Para encuadrarlo con el vocabulario que ya usas, existe un catálogo específico: MITRE ATLAS describe tácticas y técnicas adversarias contra sistemas de IA con la misma estructura de ATT&CK, y OWASP mantiene una lista de los diez riesgos principales en aplicaciones con modelos de lenguaje. Ambos son la vía natural para incorporar estos riesgos a tu análisis existente sin inventar una metodología nueva."

              example: {
                title: "En tu operación",

              quiz: [
                { q: "Un asistente lee documentos internos para responder consultas. Alguien publica un documento con instrucciones dirigidas al modelo. ¿Qué tipo de ataque es?", opts: ["Evasión", "Envenenamiento del entrenamiento", "Inyección de instrucciones", "Extracción de modelo"], a: 2, why: ["La evasión altera la entrada para forzar una clasificación errónea.", "El envenenamiento actúa sobre los datos de entrenamiento, no sobre el contenido consultado en ejecución.", "El modelo no distingue las órdenes del operador del texto que procesa.", "La extracción busca reconstruir el modelo mediante consultas."] },
                { q: "¿Por qué es peligroso que un modelo expuesto por API acepte consultas ilimitadas?", opts: ["Por el coste de cómputo únicamente", "Porque permite reconstruir una copia funcional del modelo o recuperar datos de entrenamiento", "Porque ralentiza el servicio", "Porque genera registros excesivos"], a: 1, why: ["El coste es real pero no es el riesgo principal de seguridad.", "La extracción convierte una API abierta en una vía de fuga de propiedad intelectual y de datos.", "El rendimiento es una preocupación operativa menor.", "El registro abundante es más bien deseable."] },

            {
              title: "Efectos adversos: desinformación, concentración y privacidad", mins: 18,
              body: [
                "Más allá del sesgo y de la seguridad, la adopción amplia de estos sistemas produce efectos que exceden a cualquier organización individual y que conviene comprender porque acabarán llegando en forma de regulación, de exigencia de cliente o de incidente.",
                "El primero es el abaratamiento radical de la producción de contenido falso. Generar textos, imágenes, voces y vídeos convincentes ha dejado de requerir recursos, y eso altera el valor probatorio de cualquier material digital. Para una organización, el efecto inmediato y concreto es el fraude: la suplantación de voz de un directivo para autorizar un pago, o el correo perfectamente redactado en el estilo interno de la casa. La defensa no es tecnológica sino de proceso: verificación por canal independiente para toda operación sensible, sin excepciones por urgencia o jerarquía.",
                "El segundo es la concentración. Entrenar modelos grandes exige capital y datos al alcance de muy pocos actores, lo que crea una dependencia estructural: la mayoría de las organizaciones no construirán modelos fundacionales, los consumirán. Eso tiene consecuencias prácticas de gestión de proveedor —si el proveedor cambia el precio, la disponibilidad o el comportamiento del modelo, tus sistemas cambian con él— y aconseja evitar diseños que solo funcionen con un proveedor concreto.",
                "El tercero es la erosión de la privacidad. Los modelos hacen viable inferir a partir de datos aparentemente inocuos aquello que nunca se declaró: patrones de desplazamiento, estado de salud, situación económica. La consecuencia jurídica y ética es importante: un dato deja de ser inocuo por lo que dice y pasa a serlo por lo que permite inferir. En un contexto de salud, el estándar razonable no es «este campo no es sensible», sino «qué se puede deducir del conjunto de campos que estoy tratando».",
                "El cuarto, menos comentado, es el consumo de recursos. Entrenar y operar modelos grandes tiene un coste energético y de agua no trivial, y empieza a aparecer en criterios de contratación y en reportes de sostenibilidad. Es un factor legítimo a incorporar cuando se elige entre un modelo grande y uno pequeño ajustado que resuelve el mismo problema.",
                "Ninguno de estos efectos justifica no adoptar la tecnología, y tampoco se resuelven ignorándolos. Lo que corresponde a alguien con responsabilidad sobre riesgo es tenerlos identificados, decidir cuáles aplican a la organización y dejar constancia de esa decisión. Un riesgo evaluado y aceptado explícitamente es una posición defendible; uno no considerado, no lo es.",
                "Merece mención aparte el efecto sobre el criterio propio. Cuando un sistema acierta con frecuencia, quien lo supervisa deja de revisar con atención y empieza a aceptar por defecto, justo cuando su revisión es el único control que queda. Ese deterioro es gradual y no se percibe desde dentro. La contramedida práctica es introducir casos de verificación conocidos de vez en cuando y medir si el supervisor los detecta: si deja de hacerlo, la supervisión ya es nominal."
              ],
              example: {
                title: "En tu operación",
                text: "El riesgo de suplantación por voz o correo es hoy el más concreto y el más barato de mitigar. Establece que ninguna autorización de pago, cambio de cuenta bancaria de proveedor o modificación de credenciales se ejecuta con una sola vía de comunicación, por urgente que parezca y por alto que sea el cargo de quien la solicita. Es un control de proceso, cuesta cero y neutraliza la mayor parte del ataque."
              },
              keys: [
                "El contenido falso convincente ya no requiere recursos: cambia el valor probatorio de todo material digital.",

                "Consumir modelos de terceros crea dependencia de proveedor: evita diseños atados a uno solo.",

              exercise: {

                text: "Redacta el control de verificación por canal independiente para las tres operaciones más sensibles de tu organización, en formato de procedimiento aplicable. Después revisa qué campos de tus conjuntos de datos, combinados, permitirían inferir información de salud o económica de una persona identificable, y anota qué medida de minimización aplicarías."

              quiz: [
                { q: "¿Cuál es la defensa más eficaz contra la suplantación de voz de un directivo para autorizar un pago?", opts: ["Un detector automático de audio sintético", "Un control de proceso: verificación por un canal independiente, sin excepciones por urgencia o jerarquía", "Cifrar las comunicaciones", "Formar al personal en reconocer voces falsas"], a: 1, why: ["Los detectores son poco fiables y quedan obsoletos rápido.", "Es barato, no depende de la tecnología del atacante y neutraliza la mayor parte del ataque.", "El cifrado protege el canal, no la identidad del solicitante.", "El oído humano ya no distingue las voces sintéticas actuales."] },
                { q: "¿Qué implica en la práctica la concentración del mercado de modelos fundacionales?", opts: ["Que los modelos serán más baratos", "Dependencia de proveedor: cambios de precio, disponibilidad o comportamiento afectan directamente a tus sistemas", "Que mejorará la privacidad", "Que desaparecerán los modelos abiertos"], a: 1, why: ["La tendencia de precios no es la consecuencia principal.", "Por eso conviene evitar diseños que solo funcionen con un proveedor concreto.", "La concentración no mejora la privacidad.", "Los modelos abiertos siguen existiendo y son parte de la mitigación."] },
                { q: "En sector salud, el criterio correcto para valorar la sensibilidad de un conjunto de datos es:", opts: ["Si contiene campos marcados como sensibles", "Qué se puede inferir del conjunto completo de campos sobre una persona identificable", "Si incluye el número de documento", "Si el titular firmó una autorización"], a: 1, why: ["La etiqueta de campo es insuficiente ante la inferencia.", "La combinación de campos aparentemente inocuos puede revelar salud o situación económica.", "El identificador directo es solo una parte del problema.", "La autorización es necesaria pero no determina la sensibilidad del conjunto."] }

            {
              title: "IA y empleo", mins: 16,
              body: [
                "La pregunta sobre el empleo suele plantearse mal, en términos de si una profesión desaparecerá o no. La unidad correcta de análisis no es la profesión sino la tarea. Casi ningún puesto es una sola actividad: es un conjunto de tareas, algunas automatizables y otras no. Lo que ocurre en la práctica es que se automatizan algunas tareas del puesto, cambia la composición del trabajo y con ella la formación necesaria, sin que el puesto desaparezca como tal.",
                "Esa distinción importa para dirigir. Si preguntas «¿reemplazará esto al analista de soporte?», la respuesta será defensiva y probablemente equivocada. Si preguntas «¿qué proporción del tiempo del analista se va en clasificar y enrutar tickets, y qué haría con ese tiempo si se lo devolviéramos?», obtienes una conversación productiva y, con frecuencia, una lista de trabajo valioso que hoy no se hace por falta de tiempo.",
                "Históricamente, las olas de automatización han destruido y creado empleo simultáneamente, pero no de forma simétrica ni indolora: quien pierde el puesto rara vez es quien ocupa el nuevo, y el desfase temporal y geográfico produce daño real. Reconocerlo evita dos discursos igualmente inútiles: el que promete que no pasará nada y el que anuncia el colapso. La postura defendible es que habrá transición y que gestionarla es una responsabilidad, no una fatalidad.",
                "Dentro de una organización, esa responsabilidad se concreta en cosas modestas y verificables. Anunciar con antelación qué se va a automatizar. Involucrar a quienes hacen hoy esa tarea en el diseño del sistema, porque además son quienes mejor conocen los casos raros. Ofrecer formación real hacia las tareas que crecen. Y ser honesto cuando la consecuencia sea una reducción, en lugar de disfrazarla, porque el equipo lo descubrirá igual y con el descubrimiento se acaba la colaboración en todos los proyectos siguientes.",
                "Para tu propia trayectoria, la lectura útil es que el valor se desplaza hacia lo que el sistema no hace: formular el problema, juzgar si el resultado tiene sentido, asumir responsabilidad ante un tercero y decidir cuándo no usar la herramienta. Son exactamente las capacidades que este programa intenta construir, y explican por qué el criterio importa más que la técnica concreta que esté de moda cada año.",
                "Conviene añadir una observación sobre el ritmo. Las transformaciones tecnológicas se anuncian siempre como inminentes y llegan más despacio de lo prometido, pero llegan más lejos de lo previsto. Esa combinación desaconseja tanto las decisiones apresuradas como la parálisis: lo sensato es empezar pequeño y sostenido, acumular capacidad propia, y evitar comprometer a la organización con una apuesta grande basada en un calendario que nadie puede garantizar."
              ],
              example: {
                title: "En tu operación",
                text: "Si el clasificador de tickets ahorra al analista quince minutos por turno, la pregunta a plantear en la reunión no es cuántos analistas sobran, sino qué trabajo pendiente se puede hacer ahora: revisión de causas raíz, documentación de procedimientos, cierre de hallazgos de auditoría. Presentado así, el equipo colabora en etiquetar los datos porque el sistema trabaja para ellos y no contra ellos."
              },
              keys: [
                "La unidad de análisis es la tarea, no la profesión: se automatizan tareas y cambia la composición del puesto.",
                "Preguntar qué haría el equipo con el tiempo liberado produce mejores conversaciones que preguntar quién sobra.",
                "La transición es real y asimétrica: quien pierde el puesto rara vez ocupa el nuevo.",
                "Anunciar con antelación, involucrar a quienes hacen la tarea y ser honesto sobre las consecuencias es lo que preserva la colaboración.",

              exercise: {
                mins: 15,
                text: "Descompón en tareas un puesto de tu área y marca cada una como automatizable, asistible o no aplicable, con su porcentaje aproximado de tiempo. Después escribe qué trabajo valioso hoy postergado podría ocupar el tiempo liberado. Lleva ese análisis a la persona que ocupa el puesto antes que a dirección: es la forma de que el proyecto tenga aliados."

              quiz: [
                { q: "¿Cuál es la unidad correcta para analizar el impacto de la IA en el empleo?", opts: ["La profesión completa", "La tarea: se automatizan tareas concretas y cambia la composición del puesto", "El sector económico", "El nivel educativo"], a: 1, why: ["Casi ningún puesto es una sola actividad automatizable en bloque.", "Permite un análisis concreto y accionable dentro de la organización.", "Es demasiado agregado para decidir nada.", "No es una unidad de análisis del trabajo."] },
                { q: "¿Por qué conviene involucrar en el diseño a quienes hoy hacen la tarea que se automatizará?", opts: ["Por cortesía institucional", "Porque conocen los casos raros y su colaboración es necesaria para etiquetar y detectar fallos", "Para cumplir la normativa laboral", "Para acelerar el desarrollo"], a: 1, why: ["No es una cuestión de cortesía sino de calidad del sistema.", "Su conocimiento del dominio y su cooperación determinan si el proyecto funciona.", "No es una exigencia normativa general.", "Puede incluso alargar el diseño, y aun así conviene."] },
                { q: "Según la lección, ¿hacia dónde se desplaza el valor del trabajo humano?", opts: ["Hacia tareas repetitivas de alto volumen", "Hacia formular el problema, juzgar si el resultado tiene sentido y responder ante terceros", "Hacia la programación exclusivamente", "Hacia la supervisión de máquinas"], a: 1, why: ["Son precisamente las más automatizables.", "Es lo que el sistema no hace y explica por qué el criterio importa más que la técnica de moda.", "Programar es una capacidad más, no el destino del valor.", "La supervisión pasiva es una descripción incompleta."] }

            {
              title: "Cómo decidir de forma responsable", mins: 15,
              body: [
                "Cerramos con la pregunta práctica: cómo se decide sobre un sistema de IA de forma que la decisión resista una auditoría, un incidente o simplemente el paso del tiempo. La respuesta no está en un principio abstracto sino en un procedimiento repetible, y por fortuna se parece mucho al que ya aplicas para riesgos de seguridad.",
                "El primer paso es determinar el nivel de riesgo por su impacto sobre personas, no por su complejidad técnica. Un modelo trivial que decide quién accede a un servicio de salud es de alto riesgo; uno sofisticado que ordena referencias en una bodega, no. Esta es exactamente la lógica del reglamento europeo de IA, que clasifica por uso y no por tecnología, y es un buen marco aunque no te aplique directamente, porque anticipa hacia dónde va la regulación en general.",
                "El segundo es decidir el grado de autonomía. Hay tres modos posibles y conviene nombrarlos: el sistema sugiere y una persona decide; el sistema decide y una persona puede revertir; el sistema decide sin intervención. El modo se elige según el riesgo y el coste del error, y debe quedar escrito. La mayor parte de los despliegues sensatos en una organización empiezan en el primer modo y solo avanzan con evidencia acumulada de que funcionan.",
                "El tercero es garantizar trazabilidad: registrar qué versión del modelo tomó cada decisión, con qué datos de entrada y con qué resultado. Sin ese registro no se puede investigar un incidente, no se puede responder a un afectado que pide explicaciones y no se puede demostrar diligencia. Es el equivalente al registro de auditoría de cualquier sistema crítico, y omitirlo por prisa es la decisión que más se lamenta después.",
                "El cuarto es asignar responsabilidad nominal. Un sistema no es responsable de nada; alguien lo es. Debe haber una persona identificada que responde por el funcionamiento del modelo, con autoridad para detenerlo. Si esa persona no existe, en la práctica nadie lo detendrá cuando falle, porque detenerlo siempre tendrá un coste visible mientras que el daño de mantenerlo será difuso.",
                "El quinto es revisar periódicamente, con fecha en el calendario y no cuando surja el problema. Rendimiento por grupo, deriva respecto de los datos originales, incidentes acumulados y vigencia de los supuestos iniciales. Estos cinco pasos —riesgo, autonomía, trazabilidad, responsable y revisión— caben en una página, y esa página es el punto de partida de la política de uso de IA que redactarás en el módulo V y del sistema de gestión que describe la norma ISO 42001."
              ],
              example: {
                title: "En tu operación",
                text: "Ficha de una página para el clasificador de tickets: riesgo bajo porque no afecta a personas fuera de la organización; autonomía en modo sugerencia durante los primeros seis meses; trazabilidad mediante registro de versión, entrada y salida en cada predicción; responsable nombrado con autoridad para desactivarlo; revisión trimestral de rendimiento por sede y turno. Con eso, el sistema es defendible ante cualquier auditoría."

                "No existe una definición de inteligencia artificial aceptada por todos, y conviene entender por qué antes de intentar usar una. El problema de fondo es que tampoco tenemos una definición operativa de inteligencia a secas. Cualquier definición de IA hereda esa ambigüedad, y por eso las que circulan tienden a ser o demasiado amplias —cualquier programa que haga algo aparentemente listo— o demasiado estrechas, atadas a la técnica de moda del momento.",
                "A esa dificultad se suma un fenómeno curioso conocido como el efecto IA: en cuanto un problema se resuelve, deja de considerarse inteligencia artificial. El reconocimiento óptico de caracteres, los sistemas de navegación por satélite o los filtros de correo no deseado fueron problemas de IA en su momento y hoy nadie los llama así; se llaman software. La frontera se desplaza continuamente hacia lo no resuelto, lo que hace que la IA parezca siempre una promesa futura por más cosas que ya haga.",
                "Una forma útil de acotar el término es fijarse en dos propiedades que suelen aparecer juntas en los sistemas que llamamos inteligentes. La primera es la autonomía: la capacidad de ejecutar tareas en entornos complejos sin que una persona guíe cada paso. La segunda es la adaptabilidad: la capacidad de mejorar el desempeño aprendiendo de la experiencia. Un termostato es autónomo pero no adapta nada; una hoja de cálculo puede ajustar fórmulas pero no actúa sola. Los sistemas interesantes tienen ambas.",
                "Sobre esa base se construyen las distinciones que sí importan en la práctica. La IA estrecha resuelve una tarea concreta y es todo lo que existe hoy; la IA general resolvería cualquier tarea humana y no existe. La llamada IA fuerte —la hipótesis de que un sistema pueda tener experiencia consciente— es una cuestión filosófica abierta que no afecta a ninguna decisión de ingeniería, mientras que la IA débil —comportarse como si fuera inteligente— es lo único que se evalúa y se compra.",

                "La prueba tiene limitaciones que hoy resultan evidentes. Es una medida de capacidad de imitación, no de inteligencia general: un sistema puede ser convincente en conversación y ser incapaz de sumar. Además su resultado depende mucho del evaluador y del tiempo disponible; con conversaciones breves y evaluadores no entrenados, programas muy simples han producido confusión desde los años sesenta. Y premia el engaño: para pasarla conviene simular errores humanos, escribir con faltas y fingir desconocimiento.",
                "La objeción filosófica más conocida es el argumento de la habitación china, de John Searle. Imagina a una persona encerrada que recibe símbolos chinos y, siguiendo un manual de reglas, devuelve otros símbolos correctos, sin entender una palabra. Desde fuera parece que la habitación entiende chino; dentro no hay comprensión, solo manipulación de símbolos. La conclusión de Searle es que ejecutar el programa adecuado no basta para producir comprensión.",

                "Los modelos que hemos visto hasta ahora son discriminativos: reciben una entrada y producen una etiqueta o un número. ¿Este ticket es crítico? ¿Cuántas unidades se venderán? Un modelo generativo hace algo distinto: produce contenido nuevo del mismo tipo que sus datos de entrenamiento. Texto, imágenes, audio, código, datos tabulares sintéticos. La diferencia no es de grado sino de naturaleza, y cambia por completo cómo se evalúa el resultado.",
                "El mecanismo, en el caso del texto, es más modesto de lo que sugiere el resultado. El modelo aprende a predecir qué viene después en una secuencia, entrenado sobre cantidades enormes de material escrito. Predecir la siguiente palabra parece una tarea trivial, y resulta que hacerlo muy bien exige capturar gramática, hechos, estructura argumental y estilo. La capacidad aparente de conversar es un efecto de haber resuelto bien un problema de predicción, no una habilidad diseñada explícitamente.",

                "La elección de protocolo en IoT se hace sobre un triángulo de compromisos: alcance, ancho de banda y consumo. No existe la opción que gane en los tres, y la mayoría de los errores de diseño consisten en elegir por costumbre en lugar de por requisito. Un dispositivo que envía doscientos bytes cada hora tiene necesidades opuestas a una cámara que transmite vídeo continuo, y ningún protocolo sirve bien para ambos.",
                "En la capa de aplicación, la comparación relevante para tu contexto es entre HTTP y MQTT. HTTP es el protocolo de la web: cada mensaje abre una conexión, envía cabeceras voluminosas y espera respuesta. Funciona, es familiar y atraviesa cualquier red corporativa, pero su sobrecarga es enorme cuando el mensaje útil son doscientos bytes. MQTT se diseñó justamente para este escenario: mantiene una conexión abierta, tiene cabeceras mínimas y usa un modelo de publicación y suscripción.",
                "Ese modelo de publicación y suscripción es lo que hace a MQTT arquitectónicamente atractivo. El dispositivo publica en un tema y no sabe quién lo consume; los consumidores se suscriben a los temas que les interesan. Añadir un nuevo consumidor —un panel, un sistema de alertas, un almacén analítico— no requiere tocar el dispositivo. En un parque de dispositivos que estarán diez años en campo, esa independencia entre productor y consumidor vale mucho.",
